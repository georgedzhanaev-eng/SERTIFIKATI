var GEO_KEYS = ['c4e89ddd-41b1-4ed4-9c3d-1fca0e290609',
                '03f08692-6bbb-4a05-8b0e-37c1bc87569d',
                '9afe41bb-baef-4e4a-91a9-115cbafbcb37',
                '2e3ed939-c634-493c-8f57-7bb2075986b1'];
var verifyBusy = false, geoKeyIdx = 0, verifyError = '';
var httpDead = false, mapsFails = 0;   // канал, который уже отказал, повторно не дёргаем

/* Номер дома в сравнимом виде: «д. 4, к. 1» и «4к1» — одно и то же. */
function houseCanon(t){
  var s = norm(t).replace(/[«»"']/g,' ');
  var h = '', k = '';
  var m = s.match(/(?:^|[\s,])(?:д|дом|вл|владение)\W{0,3}(\d+\s?[а-я]?(?:\/\d+\s?[а-я]?)?)/);
  if(m) h = m[1];
  if(!h){
    m = s.match(/,\s*(\d+\s?[а-я]?(?:\/\d+\s?[а-я]?)?)\s*(?:,|\(|$)/);
    if(m) h = m[1];
  }
  if(!h){                                    /* «ул. Заводская, 3 кв 49» */
    m = s.match(/,\s*(\d+\s?[а-я]?)\s+кв/);
    if(m) h = m[1];
  }
  m = s.match(/(?:^|[\s,])(?:корпус|корп|к)(?![а-я])\W{0,3}(\d+\s?[а-я]?)/);
  if(m) k = m[1];
  if(!h) return '';
  h = h.replace(/\s|\./g,'');
  if(/к$/.test(h)) h = h.slice(0, -1);        // «д. 4 к. 3» — буква к относится к корпусу
  return h + (k ? 'к' + k.replace(/\s|\./g,'') : '');
}

/* Строгое определение дома: только «д. N», «дом N», «владение N».
   Номера участков, позиций и квартир домом не считаются. */
function houseStrict(t){
  var m = norm(t).match(/(?:^|[\s,])(?:д|дом|вл|владение)\W{0,3}(\d+\s?[а-я]?(?:\/\d+\s?[а-я]?)?)/);
  return m ? m[1].replace(/\s|\./g,'') : '';
}

/* Из ответа геокодера дом стоит в конце строки: «…, Садовая, 3/1». */
function houseOfFound(t){
  var parts = norm(t).split(',');
  for(var i = parts.length - 1; i >= 0; i--){
    var p = parts[i].trim().replace(/\s|\./g,'');
    if(/^\d/.test(p)) return p;
  }
  return '';
}

function streetOf(t){
  var m = norm(t).match(/(?:ул|улица|пер|переулок|проезд|шоссе|бульвар)\.?\s+([а-яё\-]{4,25})/);
  if(m) return m[1];
  m = norm(t).match(/([а-яё\-]{4,25})\s+(?:улица|переулок|проезд|шоссе|бульвар)/);
  return m ? m[1] : '';
}

function verdictOf(query, found){
  if(!found) return { k:'none', s:'не найден' };
  if(found.precision === 'street') return { k:'street', s:'только улица' };
  if(found.precision === 'other' || found.precision === 'locality') return { k:'loc', s:'только населённый пункт' };

  var st = streetOf(query), fst = streetOf(found.text), ft = norm(found.text);
  if(st && fst && st !== fst && ft.indexOf(st) < 0) return { k:'wrong', s:'другая улица' };

  var h = houseCanon(query), fh = houseOfFound(found.text);
  /* «3/1» и «3к1» — одно и то же обозначение корпуса */
  var hs = h.replace(/\//g,'к'), fhs = fh.replace(/\//g,'к');
  if(h && fh){
    if(h === fh || hs === fhs) return { k:'ok', s:'совпадает' };
    if(fh.indexOf(h) === 0 || h.indexOf(fh) === 0) return { k:'ok', s:'совпадает' };
    if(hs.split('к')[0] === fhs.split('к')[0]) return { k:'ok', s:'совпадает' };   // тот же дом, другой корпус
    return { k:'wrong', s:'другой дом' };
  }
  if(h && !fh) return { k:'wrong', s:'дом не подтверждён' };
  if(!st && fst && h) return { k:'susp', s:'улица в таблице не указана' };
  return { k:'ok', s:'совпадает' };
}

function withTimeout(promise, ms){
  return new Promise(function(resolve){
    var done = false;
    var t = setTimeout(function(){ if(!done){ done = true; resolve(null); } }, ms);
    promise.then(function(v){ if(!done){ done = true; clearTimeout(t); resolve(v); } },
                 function(){ if(!done){ done = true; clearTimeout(t); resolve(null); } });
  });
}

function geocodeViaMaps(text){
  if(typeof ymaps === 'undefined' || !ymaps.geocode){
    verifyError = verifyError || 'Яндекс.Карты не загружены';
    return Promise.resolve(null);
  }
  if(mapsFails >= 3){
    verifyError = verifyError || 'геокодер карт не отвечает';
    return Promise.resolve(null);
  }
  return new Promise(function(resolve){
    ymaps.ready(function(){
      ymaps.geocode(text, { results:1 }).then(function(res){
        var obj = res.geoObjects.get(0);
        if(!obj){ resolve(null); return; }
        var md = obj.properties.get('metaDataProperty.GeocoderMetaData') || {};
        resolve({ text: md.text || obj.properties.get('text') || '',
                  precision: String(md.precision || '').toLowerCase() });
      }, function(){
        mapsFails++;
        verifyError = verifyError || 'геокодер карт отклонил запрос';
        resolve(null);
      });
    });
  });
}

function geocodeRaw(text, idx){
  if(httpDead) return geocodeViaMaps(text);
  idx = idx || geoKeyIdx;
  if(idx >= GEO_KEYS.length){ httpDead = true; return geocodeViaMaps(text); }
  return fetch('https://geocode-maps.yandex.ru/1.x/?apikey=' + GEO_KEYS[idx] +
               '&format=json&results=1&lang=ru_RU&geocode=' + encodeURIComponent(text))
    .then(function(resp){
      if(!resp.ok){ verifyError = 'геокодер: ответ ' + resp.status; throw new Error(resp.status); }
      geoKeyIdx = idx; return resp.json();
    })
    .then(function(j){
      var fm = j && j.response && j.response.GeoObjectCollection &&
               j.response.GeoObjectCollection.featureMember;
      if(!fm || !fm.length) return null;
      var md = fm[0].GeoObject.metaDataProperty.GeocoderMetaData;
      return { text: md.text || '', precision: String(md.precision||'').toLowerCase() };
    })
    .catch(function(){
      if(idx + 1 < GEO_KEYS.length) return geocodeRaw(text, idx + 1);
      httpDead = true;                      // все ключи отклонены — больше не пробуем
      return geocodeViaMaps(text);
    });
}


function verifyQueue(){
  var seen = {}, out = [];
  base.filter(isCert).forEach(function(r){
    addrVariants(r).forEach(function(t){
      var k = norm(t);
      if(seen[k]) return;
      seen[k] = 1; out.push(t);
    });
  });
  return out;
}

function startVerify(mapId){
  if(verifyBusy) return;
  var queue = verifyQueue();
  if(!queue.length) return;
  verifyBusy = true; verifyError = '';

  var total = queue.length, done = 0, res = [], skipped = 0, startedAt = Date.now();
  var note = document.getElementById(mapId + '-note');

  (function next(){
    if(!queue.length){
      verifyBusy = false;
      if(note) note.textContent = '';
      showVerify(res, total, skipped);
      return;
    }
    var q = queue.shift();
    if(note) note.textContent = 'Сверка адресов: ' + (done+1) + ' из ' + total +
      (verifyError ? ' · ' + verifyError : '');
    if(coordsForText(q)){ skipped++; done++; setTimeout(next, 0); return; }
    /* Что бы ни случилось внутри — следующий адрес обязан быть запущен,
       иначе прогон замирает, как это и происходило. */
    withTimeout(geocodeRaw(q), 6000).then(function(found){
      try{
        if(!found) mapsFails++; else mapsFails = 0;
        var v = verdictOf(q, found);
        res.push({ q:q, f:found ? found.text : '', v:v.s, k:v.k });
        if(mapsFails >= 5 && !res.some(function(x){ return x.k !== 'none'; })){
          queue.length = 0;
          verifyError = verifyError || 'геокодер не отвечает: проверьте ключ и домен';
        }
        if(Date.now() - startedAt > 180000){    // три минуты — предел на весь прогон
          queue.length = 0;
          verifyError = verifyError || 'прогон прерван по времени';
        }
      }catch(e){
        verifyError = verifyError || ('ошибка сверки: ' + (e && e.message ? e.message : e));
        queue.length = 0;
      }
      done++;
      setTimeout(next, 60);
    });
  })();
}

function coordsForText(t){
  var hay = ' ' + norm(t).replace(/[^а-яa-z0-9.\s]/g,' ')
    .replace(/\.(?!\d)/g,' ').replace(/([а-яa-z])\.?(\d)/g,'$1 $2').replace(/(\d)\s*([а-яa-z])/g,'$1 $2')
    .replace(/\s+/g,' ') + ' ';
  var words = hay.trim().split(' ');
  function wordHit(tok){
    for(var i=0;i<words.length;i++){
      var w = words[i];
      if(w === tok) return true;
      if(tok.length >= 6 && w.length >= 6 && w.slice(0,6) === tok.slice(0,6)) return true;
    }
    return false;
  }
  function hit(tokens, minLen){
    if(!tokens || !tokens.length) return false;
    if(minLen && tokens.length < minLen && !(tokens.length === 1 && tokens[0].length >= 8)) return false;
    for(var j=0;j<tokens.length;j++){ if(!wordHit(tokens[j])) return false; }
    return true;
  }
  var i, recHouse = !!houseStrict(t);
  for(i=0;i<COORD_BOOK.length;i++){
    if(COORD_BOOK[i].noHouse && !COORD_BOOK[i].hasNum && recHouse) continue;
    if(hit(COORD_BOOK[i].t)) return COORD_BOOK[i].c;
  }
  if(recHouse) return null;                   // в адресе есть номер дома — справочник не нужен
  for(i=0;i<COORD_BOOK.length;i++){ if(hit(COORD_BOOK[i].t2, 2)) return COORD_BOOK[i].c; }
  return null;
}

function showVerify(res, total, skipped){
  var old = document.getElementById('vf-box');
  if(old) old.remove();
  var order = { wrong:1, susp:2, none:3, loc:4, street:5, ok:6 };
  var list = res.slice().sort(function(a,b){ return (order[a.k]-order[b.k]) || a.q.localeCompare(b.q,'ru'); });
  var cnt = { ok:0, wrong:0, susp:0, street:0, loc:0, none:0 };
  list.forEach(function(x){ cnt[x.k]++; });

  var box = document.createElement('div');
  box.id = 'vf-box';
  box.innerHTML =
    '<header><h2>Сверка адресов с картой</h2>' +
    '<span style="font-size:12px;color:var(--muted)">проверено '+fmtInt.format(list.length)+' из '+fmtInt.format(total)+
      ' · по координатам, без проверки: '+fmtInt.format(skipped)+
      ' · совпадает '+cnt.ok+' · другой дом или улица '+cnt.wrong+
      ' · улица не указана '+cnt.susp+
      ' · только улица '+cnt.street+' · только нас. пункт '+cnt.loc+' · не найден '+cnt.none+
      (verifyError ? ' · ' + esc(verifyError) : '') + '</span>' +
    '<button class="ctrl" type="button" id="vf-csv" style="padding:6px 12px;font-size:12px">Скачать CSV</button>' +
    '<button class="ctrl" type="button" id="vf-close" style="padding:6px 12px;font-size:12px">Закрыть</button></header>' +
    '<div id="vf-list">' + list.map(function(x,i){
      return '<div class="vf-row"><span class="item-rank num">'+(i+1)+'</span>' +
        '<span class="vf-v vf-'+x.k+'">'+esc(x.v)+'</span>' +
        '<span>'+esc(x.q)+'<span class="addr-okrug">нашлось: '+esc(x.f || '—')+'</span></span></div>';
    }).join('') + '</div>';
  document.body.appendChild(box);

  document.getElementById('vf-close').addEventListener('click', function(){ box.remove(); });
  document.getElementById('vf-csv').addEventListener('click', function(){
    var csv = '\ufeffВердикт;Адрес в таблице;Что нашлось\n' + list.map(function(x){
      return [x.v, x.q, x.f].map(function(y){ return '"'+String(y).replace(/"/g,'""')+'"'; }).join(';');
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    a.download = 'sverka-adresov.csv';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  });
}

/* Ссылка на панораму по адресу приобретения. */
function panoUrl(r){
  var c = coordsFor(r);
  if(c) return 'https://yandex.ru/maps/?ll=' + c[1] + '%2C' + c[0] +
    '&z=18&l=stv%2Csta&pt=' + c[1] + ',' + c[0];
  var v = addrVariants(r);
  if(!v.length) return '';
  return 'https://yandex.ru/maps/?l=stv%2Csta&text=' + encodeURIComponent(v[0]);
}

/* Чарт с адресами: откуда (столбец F) → куда (столбец X).
   selectable: строки кликабельны, выбор сужает карту до одного направления.
   Выбор хранится по самой строке таблицы, а не по тексту адреса. */
/* Позиция прокрутки списков не должна теряться при перерисовке:
   клик по адресу или округу оставляет список там же, где он был. */
var scrollKeep = {};
function snapScroll(){
  var boxes = document.querySelectorAll('.scroll');
  for(var i=0;i<boxes.length;i++){
    var id = boxes[i].id || (boxes[i].parentNode && boxes[i].parentNode.id);
    if(id) scrollKeep[id] = boxes[i].scrollTop;
  }
}
function restoreScroll(){
  var boxes = document.querySelectorAll('.scroll');
  for(var i=0;i<boxes.length;i++){
    var id = boxes[i].id || (boxes[i].parentNode && boxes[i].parentNode.id);
    if(id && scrollKeep[id]) boxes[i].scrollTop = scrollKeep[id];
  }
}

function renderAddresses(boxId, rowsIn, opts){
  opts = opts || {};
  var list = rowsIn.slice().sort(function(a,b){
    return okrugName(a).localeCompare(okrugName(b),'ru') ||
           String(a[COL.addr]||'').localeCompare(String(b[COL.addr]||''),'ru');
  });
  var body = list.length
    ? list.map(function(r,i){
        var attrs = opts.selectable
          ? ' role="button" tabindex="0" data-i="'+i+'" aria-pressed="'+(opts.selected === r)+'"'
          : '';
        var pUrl = panoUrl(r);
        var pano = pUrl
          ? '<a class="addr-ya" href="'+pUrl+'" target="_blank" rel="noopener" title="Панорама по адресу приобретения">Я</a>'
          : '<span></span>';
        return '<div class="addr-item"'+attrs+'><span class="item-rank num">'+(i+1)+'</span>' +
          '<span class="addr-txt addr-from"><span class="addr-okrug">'+esc(okrugName(r))+'</span>' +
            esc(String(r[COL.addr]||'—').trim()) + '</span>' +
          '<span class="addr-txt addr-to"><span class="addr-okrug">'+esc(resolveOkrug(r[COL.newOkrug])||'—')+'</span>' +
            esc(String(r[COL.newAddr]||'—').trim()) + '</span>' +
          '<span class="addr-area num">'+fmtArea.format(num(r[COL.area]))+' м²</span>' + pano + '</div>';
      }).join('')
    : '<div class="empty">Нет записей по текущему фильтру.</div>';

  document.getElementById(boxId).innerHTML =
    '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Адреса · откуда → куда</div>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">'+fmtInt.format(list.length)+' записей</span></div>' +
    '<div class="scroll" id="scroll-'+boxId+'">'+body+'</div>';

  if(opts.selectable && opts.onSelect){
    var rows = document.querySelectorAll('#'+boxId+' [data-i]');
    for(var i=0;i<rows.length;i++){
      rows[i].addEventListener('click', function(e){
        if(e.target.closest('.addr-ya')) return;      // клик по кнопке панорамы
        opts.onSelect(list[+this.getAttribute('data-i')]);
      });
      rows[i].addEventListener('keydown', function(e){
        if(e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        var rec = list[+this.getAttribute('data-i')];
        if(e.key === 'Enter' && opts.selected === rec){
          var u = panoUrl(rec);
          if(u) window.open(u, '_blank', 'noopener');
          return;
        }
        opts.onSelect(rec);
      });
    }
  }
}

var IN_METRICS = [
  { key:null,  name:'Количество',   tone:'var(--c-cert)', test:function(){return true;} },
  { key:'ten', name:'Наниматели',   tone:'var(--c-ten)',  test:isTenant },
  { key:'own', name:'Собственники', tone:'var(--c-own)',  test:isOwner }
];

function renderIn(){
  snapScroll();
  var all = outRowsAll();                       // те же межокружные переезды
  var it = tenureTest(inTenure);
  var byOkrug = all.filter(function(r){
    if(inOkrug && resolveOkrug(r[COL.newOkrug]) !== inOkrug) return false;
    if(inFrom && norm(okrugName(r)) !== inFrom) return false;
    return true;
  });
  var scope = byOkrug.filter(function(r){ return !it || it(r); });

  document.getElementById('i-lead').innerHTML = IN_METRICS.map(function(m){
    var cnt = 0, area = 0;
    for(var i=0;i<scope.length;i++){
      if(!m.test(scope[i])) continue;
      cnt++; area += num(scope[i][COL.area]);
    }
    var share = byOkrug.length ? cnt/byOkrug.length : 0;
    var head = '<div class="tile-head"><div class="tile-name">'+m.name+'</div>' + ring(share, m.tone) + '</div>' +
      '<div class="tile-figs"><span class="fig num">'+fmtInt.format(cnt)+'</span><span class="fig-unit">помещений</span></div>' +
      '<div class="tile-area"><span>Площадь</span><span class="num">'+fmtArea.format(area)+' м²</span></div>';
    if(!m.key) return '<div class="tile" style="--tone:'+m.tone+'">'+head+'</div>';
    return '<button class="tile" type="button" data-itenure="'+m.key+'" aria-pressed="'+(inTenure===m.key)+'" style="--tone:'+m.tone+'">'+head+'</button>';
  }).join('');

  var itiles = document.querySelectorAll('[data-itenure]');
  for(var t=0;t<itiles.length;t++) itiles[t].addEventListener('click', function(){
    var k = this.getAttribute('data-itenure');
    inTenure = (inTenure === k) ? null : k;
    renderIn();
  });

  tabFilters({
    box:'i-filters', okrugLabel:'Округ приобретения',
    okrugs: okrugOptions(all, function(r){ return resolveOkrug(r[COL.newOkrug]); }, function(r){ return resolveOkrug(r[COL.newOkrug]); }),
    okrug: inOkrug, tenure: inTenure, searchKey:'in',
    onOkrug: function(v){ inOkrug = v; renderIn(); },
    onTenure: function(v){ inTenure = v; renderIn(); }
  });

  var fromTitle = inOkrug ? 'Откуда приехали · ' + esc(inOkrug) : 'Откуда приехали';
  document.getElementById('i-lists').innerHTML =
    '<section class="panel" style="--tone:var(--c-cert)">' +
      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Куда приехали</div></div>' +
      '<div class="scroll" id="i-list-to"></div></section>' +
    '<section class="panel" style="--tone:var(--c-buy)">' +
      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>'+fromTitle+'</div></div>' +
      '<div class="scroll" id="i-list-from"></div></section>';

  var agg = {}, order = [];
  all.filter(function(r){
    if(it && !it(r)) return false;
    if(inFrom && norm(okrugName(r)) !== inFrom) return false;
    return true;
  }).forEach(function(r){
    var to = resolveOkrug(r[COL.newOkrug]);
    if(!to) return;
    if(!agg[to]){ agg[to] = { id:to, name:to, cnt:0, area:0 }; order.push(to); }
    agg[to].cnt++; agg[to].area += num(r[COL.area]);
  });
  var toList = order.map(function(id){ return agg[id]; });
  toList.sort(function(a,b){ return (b.cnt-a.cnt) || a.name.localeCompare(b.name,'ru'); });
  document.getElementById('i-list-to').innerHTML = okrugRows(toList, 'cnt', inOkrug);

  if(!inOkrug){
    document.getElementById('i-list-from').innerHTML =
      '<div class="empty">Выберите округ в списке слева — здесь появятся округа, откуда в него приехали.</div>';
  }else{
    var fromList = aggregate(all.filter(function(r){
      if(resolveOkrug(r[COL.newOkrug]) !== inOkrug) return false;
      return !it || it(r);
    }));
    fromList.sort(function(a,b){ return (b.cnt-a.cnt) || a.name.localeCompare(b.name,'ru'); });
    document.getElementById('i-list-from').innerHTML = fromList.length
      ? okrugRows(fromList, 'cnt', inFrom).replace(/data-cokrug/g,'data-ifrom')
      : '<div class="empty">Нет данных.</div>';
  }

  var items = document.querySelectorAll('#i-list-to [data-cokrug]');
  for(var j=0;j<items.length;j++) items[j].addEventListener('click', function(){
    var id = this.getAttribute('data-cokrug');
    inOkrug = (inOkrug === id) ? null : id;
    inFrom = null; addrSel['in'] = null;
    renderIn();
  });
  var fromItems = document.querySelectorAll('#i-list-from [data-ifrom]');
  for(var k=0;k<fromItems.length;k++) fromItems[k].addEventListener('click', function(){
    var id = this.getAttribute('data-ifrom');
    inFrom = (inFrom === id) ? null : id;
    addrSel['in'] = null;
    renderIn();
  });

  if(addrSel['in'] && scope.indexOf(addrSel['in']) < 0) addrSel['in'] = null;
  var pickedIn = addrSel['in'] ? [addrSel['in']] : [];
  refreshAddr['in'] = function(){
    renderAddresses('i-addr', applyQuery(scope, query['in']), {
      selectable:true, selected:addrSel['in'],
      onSelect:function(rec){ addrSel['in'] = (addrSel['in'] === rec) ? null : rec; renderIn(); }
    });
  };
  refreshAddr['in']();
  panoSel['in'] = pickedIn.length ? panoUrl(pickedIn[0]) : '';
  restoreScroll();
  drawMigMap('i-map', pickedIn.length ? pickedIn : scope);
}

function stayRowsAll(){
  return base.filter(isCert).filter(function(r){
    var to = resolveOkrug(r[COL.newOkrug]);
    return to && to === resolveOkrug(okrugName(r));
  });
}

var STAY_METRICS = [
  { key:null,  name:'Количество',   tone:'var(--c-own)', test:function(){return true;} },
  { key:'ten', name:'Наниматели',   tone:'var(--c-ten)', test:isTenant },
  { key:'own', name:'Собственники', tone:'var(--c-buy)', test:isOwner }
];

function renderStay(){
  snapScroll();
  var all = stayRowsAll();
  var st = tenureTest(stayTenure);
  var byOkrug = stayOkrug ? all.filter(function(r){ return norm(okrugName(r)) === stayOkrug; }) : all;
  var scope = byOkrug.filter(function(r){ return !st || st(r); });

  document.getElementById('s-lead').innerHTML = STAY_METRICS.map(function(m){
    var cnt = 0, area = 0;
    for(var i=0;i<scope.length;i++){
      if(!m.test(scope[i])) continue;
      cnt++; area += num(scope[i][COL.area]);
    }
    var share = byOkrug.length ? cnt/byOkrug.length : 0;
    var head = '<div class="tile-head"><div class="tile-name">'+m.name+'</div>' + ring(share, m.tone) + '</div>' +
      '<div class="tile-figs"><span class="fig num">'+fmtInt.format(cnt)+'</span><span class="fig-unit">помещений</span></div>' +
      '<div class="tile-area"><span>Площадь</span><span class="num">'+fmtArea.format(area)+' м²</span></div>';
    if(!m.key) return '<div class="tile" style="--tone:'+m.tone+'">'+head+'</div>';
    return '<button class="tile" type="button" data-stenure="'+m.key+'" aria-pressed="'+(stayTenure===m.key)+'" style="--tone:'+m.tone+'">'+head+'</button>';
  }).join('');

  var stiles = document.querySelectorAll('[data-stenure]');
  for(var t=0;t<stiles.length;t++) stiles[t].addEventListener('click', function(){
    var k = this.getAttribute('data-stenure');
    stayTenure = (stayTenure === k) ? null : k;
    renderStay();
  });

  tabFilters({
    box:'s-filters', okrugLabel:'Округ',
    okrugs: okrugOptions(all, function(r){ return norm(okrugName(r)); }, function(r){ return okrugName(r); }),
    okrug: stayOkrug, tenure: stayTenure, searchKey:'stay',
    onOkrug: function(v){ stayOkrug = v; addrSel.stay = null; renderStay(); },
    onTenure: function(v){ stayTenure = v; renderStay(); }
  });

  var list = aggregate(all.filter(function(r){ return !st || st(r); }));
  list.sort(function(a,b){ return (b.cnt-a.cnt) || a.name.localeCompare(b.name,'ru'); });
  document.getElementById('s-list').innerHTML =
    '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Остались по округам</div></div>' +
    '<div class="scroll" id="s-list-okrug">' + okrugRows(list, 'cnt', stayOkrug).replace(/data-cokrug/g,'data-sokrug') + '</div>';
  var items = document.querySelectorAll('#s-list-okrug [data-sokrug]');
  for(var j=0;j<items.length;j++) items[j].addEventListener('click', function(){
    var id = this.getAttribute('data-sokrug');
    stayOkrug = (stayOkrug === id) ? null : id;
    addrSel.stay = null;
    renderStay();
  });

  if(addrSel.stay && scope.indexOf(addrSel.stay) < 0) addrSel.stay = null;
  var picked = addrSel.stay ? [addrSel.stay] : [];
  refreshAddr.stay = function(){
    renderAddresses('s-addr', applyQuery(scope, query.stay), {
      selectable:true, selected:addrSel.stay,
      onSelect:function(rec){ addrSel.stay = (addrSel.stay === rec) ? null : rec; renderStay(); }
    });
  };
  refreshAddr.stay();
  panoSel.stay = picked.length ? panoUrl(picked[0]) : '';
  restoreScroll();
  drawMigMap('s-map', picked.length ? picked : scope);
}

/* Вкладка «Миграция»: все сертификаты с указанным округом приобретения. */
function migRowsAll(){
  return base.filter(isCert).filter(function(r){ return !!resolveOkrug(r[COL.newOkrug]); });
}
function migFrom(r){ return norm(okrugName(r)); }
function migTo(r){ return norm(resolveOkrug(r[COL.newOkrug])); }
function migMoved(r){ return migFrom(r) !== migTo(r); }

function migMatch(r, flow, okrug){
  if(flow === 'out')  return migMoved(r) && (!okrug || migFrom(r) === okrug);
  if(flow === 'in')   return migMoved(r) && (!okrug || migTo(r) === okrug);
  if(flow === 'stay') return !migMoved(r) && (!okrug || migFrom(r) === okrug);
  return !okrug || migFrom(r) === okrug || migTo(r) === okrug;
}

var MIG_METRICS = [
  { key:'out',  name:'Уехали',       tone:'var(--c-buy)'  },
  { key:'in',   name:'Приняли',      tone:'var(--c-cert)' },
  { key:'stay', name:'Остались',     tone:'var(--c-agr)'  },
  { key:'ten',  name:'Наниматели',   tone:'var(--c-ten)'  },
  { key:'own',  name:'Собственники', tone:'var(--c-own)'  }
];

function renderMig(){
  snapScroll();
  var all = migRowsAll();
  var mt = tenureTest(migTenure);
  var denomRows = all.filter(function(r){ return migMatch(r, migFlow, migOkrug); });
  var scope = denomRows.filter(function(r){ return !mt || mt(r); });
  var denom = all.filter(function(r){ return migMatch(r, null, migOkrug); }).length;

  document.getElementById('m-lead').innerHTML = MIG_METRICS.map(function(m){
    var rows;
    if(m.key === 'ten' || m.key === 'own'){
      var tf = tenureTest(m.key);
      rows = all.filter(function(r){ return migMatch(r, migFlow, migOkrug) && tf(r); });
    }else{
      rows = all.filter(function(r){ return migMatch(r, m.key, migOkrug) && (!mt || mt(r)); });
    }
    var cnt = rows.length, area = 0;
    rows.forEach(function(r){ area += num(r[COL.area]); });
    var share = denom ? cnt/denom : 0;
    var on = (m.key === 'ten' || m.key === 'own') ? (migTenure === m.key) : (migFlow === m.key);
    return '<button class="tile" type="button" data-mig-k="'+m.key+'" aria-pressed="'+on+'" style="--tone:'+m.tone+'">' +
      '<div class="tile-head"><div class="tile-name">'+m.name+'</div>' + ring(share, m.tone) + '</div>' +
      '<div class="tile-figs"><span class="fig num">'+fmtInt.format(cnt)+'</span><span class="fig-unit">помещений</span></div>' +
      '<div class="tile-area"><span>Площадь</span><span class="num">'+fmtArea.format(area)+' м²</span></div></button>';
  }).join('');

  var tiles = document.querySelectorAll('[data-mig-k]');
  for(var t=0;t<tiles.length;t++) tiles[t].addEventListener('click', function(){
    var k = this.getAttribute('data-mig-k');
    if(k === 'ten' || k === 'own') migTenure = (migTenure === k) ? null : k;
    else migFlow = (migFlow === k) ? null : k;
    renderMig();
  });

  var opts = {}, list = [];
  all.forEach(function(r){
    [[migFrom(r), okrugName(r)], [migTo(r), resolveOkrug(r[COL.newOkrug])]].forEach(function(pair){
      if(!pair[0] || opts[pair[0]]) return;
      opts[pair[0]] = 1; list.push({ id:pair[0], name:pair[1] });
    });
  });
  list.sort(function(a,b){ return a.name.localeCompare(b.name,'ru'); });
  tabFilters({
    box:'m-filters', okrugLabel:'Округ',
    okrugs: list, okrug: migOkrug, tenure: migTenure,
    onOkrug: function(v){ migOkrug = v; renderMig(); },
    onTenure: function(v){ migTenure = v; renderMig(); }
  });

  restoreScroll();
  /* Без выбранного направления, но с выбранным округом линии разделяются:
     охра — уехали из него, синий — приехали в него. */
  var lineColor;
  if(migFlow === 'in') lineColor = '#1b4d8f';
  else if(migFlow === 'stay') lineColor = '#6c4a86';
  else if(migFlow === 'out') lineColor = '#a96a15';
  else if(migOkrug) lineColor = function(p){
    return norm(p.from) === migOkrug ? '#a96a15' : '#1b4d8f';
  };
  else lineColor = '#a96a15';
  drawMigMap('m-map', scope, lineColor);
}

function switchTo(name){
  tab = name;
  document.getElementById('view-main').hidden = name !== 'main';
  document.getElementById('view-cert').hidden = name !== 'cert';
  document.getElementById('view-out').hidden  = name !== 'out';
  document.getElementById('view-in').hidden   = name !== 'in';
  document.getElementById('view-stay').hidden = name !== 'stay';
  document.getElementById('view-mig').hidden  = name !== 'mig';
  var btn = document.getElementById('tab-btn');
  btn.textContent = name === 'main' ? 'Сертификаты' : 'Общий дашборд';
  [['nav-mig','mig'],['nav-out','out'],['nav-in','in'],['nav-stay','stay']].forEach(function(pair){
    document.getElementById(pair[0]).setAttribute('aria-pressed', name === pair[1] ? 'true' : 'false');
  });
  if(name === 'out') renderOut();
  if(name === 'in') renderIn();
  if(name === 'stay') renderStay();
  if(name === 'mig') renderMig();
  window.scrollTo({ top:0, behavior:'auto' });   // вкладка открывается с начала страницы
}

function switchTab(){
  switchTo(tab === 'main' ? 'cert' : 'main');   // «Общий дашборд» всегда ведёт на первую вкладку
}

    return (state.deal === 'cert' && m.key === 'buy')
      ? { key:null, name:'ДКП/ДДУ', tone:'var(--c-agr)', test:isDkp }
      : m;
  });

  document.getElementById('row-lead').innerHTML = tiles.map(function(m){
    var cnt = 0, area = 0;
    for(var i=0;i<view.length;i++){
      if(!m.test(view[i])) continue;
      cnt++; area += num(view[i][COL.area]);
    }
    var share = denom ? cnt/denom : 0;
    var head = '<div class="tile-head"><div class="tile-name">'+m.name+'</div>' + ring(share, m.tone) + '</div>' +
      '<div class="tile-figs"><span class="fig num">'+fmtInt.format(cnt)+'</span><span class="fig-unit">помещений</span></div>' +

/* ── Застройщики: сведение написаний ────────────────────────────────────
   «ООО "СЗ "Самолет-Мытищи"», «ООО СЗ Самолет-Мытищи», «Самолет-Мытищи»
   — одна и та же организация. Правовая форма отбрасывается и в ключе,
   и в подписи, кавычки и лишние пробелы убираются. */
var LEGAL = /(^|\s)(общество с ограниченной ответственностью|акционерное общество|специализированный застройщик|специализированного застройщика|специализированный|специализированного|спецзастройщик|спецзастройщика|спец застройщик|застройщик|застройщика|ооо|оао|зао|пао|нао|ао|ип|тсн|жск|сз|гк)(\s|$)/gi;

function builderClean(raw){
  var t = String(raw||'').replace(/[«»"'„“”¬]/g,' ').replace(/\s+/g,' ').trim();
  /* «(сокращённое наименование — Фортуна)» — скобка часто не закрыта */
  t = t.replace(/\(?\s*сокращ[а-яё]*\s+наименован[а-яё]*[\s\S]*$/gi, '');
  /* длинное официальное название фонда дольщиков — в короткую форму */
  if(/фонд[а-яё]*\s+защиты\s+прав\s+граждан/i.test(t)) return 'УНО Фонд защиты прав граждан';
  t = t.replace(/\s*ИНН[\s:№]*\d+/gi, '');                  /* «, ИНН: 5007064757» */
  t = t.replace(/\([^)]*\)?/g, ' ');                          /* «(ООО Восточный )» */
  /* полная формула правовой формы, в том числе с опечатками */
  t = t.replace(/обществ[а-яё]*\s+с\s+ограни[а-яё]*\s+ответственност[а-яё]*/gi, ' ');
  t = t.replace(/(^|\s)спец\.?(\s|$)/gi, ' ');
  /* «…-спецзастройщик», «— застройщик» и подобные хвосты через дефис */
  t = t.replace(/\s*[-–—_]\s*(спец\s*)?застройщи[а-яё]*/gi, '');
  t = t.replace(/\s*[-–—_]\s*специализированн[а-яё]+\s+застройщи[а-яё]*/gi, '');
  var prev;
  do { prev = t; t = t.replace(LEGAL, ' ').replace(/\s+/g,' ').trim(); } while(t !== prev);
  return t.replace(/^[-–—,.\s]+|[-–—,.\s]+$/g,'');
}
function builderKey(raw){ return norm(builderClean(raw)).replace(/[^a-zа-я0-9]+/g,' ').replace(/\s+/g,' ').trim(); }

/* Расстояние Левенштейна — ловит опечатки: «Строийиндустрия» и «Стройиндустрия». */
function lev(a, b){
  if(a === b) return 0;
  if(Math.abs(a.length - b.length) > 3) return 99;
  var prev = [], cur = [], i, j;
  for(j = 0; j <= b.length; j++) prev[j] = j;
  for(i = 1; i <= a.length; i++){
    cur[0] = i;
    for(j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a.charAt(i-1) === b.charAt(j-1) ? 0 : 1));
    }
    for(j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

/* Значимые слова названия: короткие («гс», «дск») не различают организации. */
function bigTokens(key){
  return key.split(' ').filter(function(w){ return w.length >= 4; });
}

/* Две записи считаются одним застройщиком, если:
   — ключи совпадают;
   — отличаются на одну-две буквы (опечатка);
   — значимые слова одного целиком входят в другое
     («Саввино» ⊂ «Главстрой Саввино», сокращение ГС-Саввино). */
function sameBuilder(a, b){
  if(a === b) return true;
  var la = a.replace(/\s/g,''), lb = b.replace(/\s/g,'');
  if(Math.min(la.length, lb.length) >= 6 && lev(la, lb) <= 2) return true;
  var ta = bigTokens(a), tb = bigTokens(b);
  if(!ta.length || !tb.length) return false;
  var small = ta.length <= tb.length ? ta : tb;
  var large = ta.length <= tb.length ? tb : ta;
  return small.every(function(w){
    return large.some(function(x){ return x === w || (Math.min(w.length,x.length) >= 6 && lev(w, x) <= 2); });
  });
}

/* Чарт застройщиков (столбец Z) — только при выбранном фильтре «Сертификаты». */
function renderBuilders(){
  snapScroll();
  var box = document.getElementById('row-dev');
  if(state.deal !== 'cert'){ box.innerHTML = ''; return; }

  var agg = {}, order = [];
  base.forEach(function(r){
    if(!isCert(r) || !passFilters(r)) return;
    var raw = String(r[COL.builder]||'').replace(/\s+/g,' ').trim();
    if(!raw || raw === '—' || raw === '-') return;
    var id = builderKey(raw);
    if(!id) return;
    var hit = null;
    for(var k = 0; k < order.length; k++){          // ищем уже заведённую группу
      if(sameBuilder(id, order[k])){ hit = order[k]; break; }
    }
    if(hit === null){ hit = id; agg[id] = { id:id, name:'', cnt:0, area:0, vars:{} }; order.push(id); }
    var label = builderClean(raw);
    agg[hit].vars[label] = (agg[hit].vars[label] || 0) + 1;
    agg[hit].cnt++; agg[hit].area += num(r[COL.area]);
  });
  var list = order.map(function(id){
    var o = agg[id], best = '', bestN = -1;
    Object.keys(o.vars).forEach(function(v){        // подпись — самое частое написание
      var n = o.vars[v];
      if(n > bestN || (n === bestN && v.length > best.length)){ best = v; bestN = n; }
    });
    o.name = best;
    devNames[o.id] = best;
    return o;
  });
  var mode = sortMode.dev;
  list.sort(function(a,b){ return (b[mode]-a[mode]) || a.name.localeCompare(b.name,'ru'); });

  var cnt = 0, area = 0;
  list.forEach(function(o){ cnt += o.cnt; area += o.area; });

  if(devSel && !list.some(function(o){ return o.id === devSel; })) devSel = null;
  var rowsHtml = list.length
    ? (function(){
        var max = list[0][mode] || 1;
        return list.map(function(o,i){
          var w = Math.max(2, Math.round(o[mode]/max*100));
          return '<button class="item" type="button" data-dev="'+esc(o.id)+'" aria-pressed="'+(devSel===o.id)+'">' +
            '<span class="item-rank num">'+(i+1)+'</span>' +
            '<span class="item-name" title="'+esc(o.name)+'">'+esc(o.name)+'</span>' +
            '<span class="bar"><i style="width:'+w+'%"></i></span>' +
            '<span class="item-cnt num">'+fmtInt.format(o.cnt)+'</span>' +
            '<span class="item-area num">'+fmtArea.format(o.area)+' м²</span></button>';
        }).join('');
      })()
    : '<div class="empty">В выборке не указан застройщик.</div>';

  /* Пересечение со столбцом X: где есть и адрес, и застройщик, и где чего-то нет. */
  var devAndAddr = 0, devNoAddr = 0, addrNoDev = 0;
  base.forEach(function(r){
    if(!isCert(r) || !passFilters(r)) return;
    /* Тот же признак, что и в списке: название должно оставаться
       после отбрасывания правовой формы, иначе застройщик не определён. */
    var b = String(r[COL.builder]||'').trim();
    var hasDev = !!b && b !== '—' && b !== '-' && !!builderKey(b);
    var hasAddr = addrVariants(r).length > 0;
    if(hasDev && hasAddr) devAndAddr++;
    else if(hasDev) devNoAddr++;
    else if(hasAddr) addrNoDev++;
  });
  var devSplit = 'адрес и застройщик <b class="num">'+fmtInt.format(devAndAddr)+'</b>' +
    ' · <button type="button" class="gap-btn" data-gap="devNoAddr" aria-pressed="'+(gapSel==='devNoAddr')+'">' +
      'застройщик без адреса <b class="num">'+fmtInt.format(devNoAddr)+'</b></button>' +
    ' · <button type="button" class="gap-btn" data-gap="addrNoDev" aria-pressed="'+(gapSel==='addrNoDev')+'">' +
      'адрес без застройщика <b class="num">'+fmtInt.format(addrNoDev)+'</b></button>';

  if(gapSel) rowsHtml = gapRows(gapSel);

  box.innerHTML =
    listPanel('Застройщики', 'var(--c-cert)', list, mode, 'dsortdev', rowsHtml, cnt, area, devSplit) +
    jkPanel();

  var btns = document.querySelectorAll('[data-dsortdev]');
  for(var i=0;i<btns.length;i++) btns[i].addEventListener('click', function(){
    sortMode.dev = this.getAttribute('data-dsortdev');
    renderBuilders();
  });
  var gapBtns = document.querySelectorAll('[data-gap]');
  for(var g=0;g<gapBtns.length;g++) gapBtns[g].addEventListener('click', function(){
    var k = this.getAttribute('data-gap');
    gapSel = (gapSel === k) ? null : k;
    renderBuilders();
  });

  var devRows = document.querySelectorAll('[data-dev]');
  for(var d=0;d<devRows.length;d++) devRows[d].addEventListener('click', function(){
    var id = this.getAttribute('data-dev');
    devSel = (devSel === id) ? null : id;
    renderBuilders();
  });

  var jkGapBtns = document.querySelectorAll('[data-jkgap]');
  for(var q=0;q<jkGapBtns.length;q++) jkGapBtns[q].addEventListener('click', function(){
    var k = this.getAttribute('data-jkgap');
    jkGapSel = (jkGapSel === k) ? null : k;
    renderBuilders();
  });

  var jkBtns = document.querySelectorAll('[data-jksort]');
  for(var j=0;j<jkBtns.length;j++) jkBtns[j].addEventListener('click', function(){
    sortMode.jk = this.getAttribute('data-jksort');
    renderBuilders();
  });

  restoreScroll();
}

/* Записи с пропуском: застройщик без адреса или адрес без застройщика. */
function gapRows(kind){
  var out = [];
  base.forEach(function(r){
    if(!isCert(r) || !passFilters(r)) return;
    var b = String(r[COL.builder]||'').trim();
    var hasDev = !!b && b !== '—' && b !== '-' && !!builderKey(b);
    var hasAddr = addrVariants(r).length > 0;
    if(kind === 'devNoAddr' ? (hasDev && !hasAddr) : (hasAddr && !hasDev)) out.push(r);
  });
  if(!out.length) return '<div class="empty">Таких записей нет.</div>';
  return out.map(function(r,i){
    var right = kind === 'devNoAddr'
      ? esc(builderClean(String(r[COL.builder]||'')))
      : esc(addrVariants(r)[0] || '');
    return '<div class="jk-item"><span class="item-rank num">'+(i+1)+'</span>' +
      '<span class="jk-name"><span class="addr-okrug">'+esc(okrugName(r))+' · '+
        esc(String(r[COL.addr]||'—').trim())+'</span>'+right+'</span>' +
      '<span class="item-cnt num">'+fmtArea.format(num(r[COL.area]))+'</span></div>';
  }).join('');
}

/* Оболочка панели со списком: заголовок, итоги, переключатель сортировки. */
function listPanel(title, tone, list, mode, attr, rowsHtml, cnt, area, split){
  return '<section class="panel" style="--tone:'+tone+'">' +
    '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>'+title+'</div>' +
    '<span class="panel-cnt">'+fmtInt.format(list.length)+'</span>' +
    '<span class="panel-area">'+fmtInt.format(cnt)+' помещений · '+fmtArea.format(area)+' м²</span>' +
    '<div class="sortgroup" role="group" aria-label="Сортировка: '+title+'">' +
    '<button class="ctrl" type="button" data-'+attr+'="cnt" aria-pressed="'+(mode==='cnt')+'">По количеству</button>' +
    '<button class="ctrl" type="button" data-'+attr+'="area" aria-pressed="'+(mode==='area')+'">По площади</button></div>' +
    '</div>' +
    (split ? '<div class="jk-split jk-split-row">'+split+'</div>' : '') +
    '<div class="scroll" id="scroll-'+attr+'">'+rowsHtml+'</div></section>';
}

function barRows(list, mode){
  if(!list.length) return '<div class="empty">Нет данных.</div>';
  var max = list[0][mode] || 1;
  return list.map(function(o,i){
    var w = Math.max(2, Math.round(o[mode]/max*100));
    return '<div class="item"><span class="item-rank num">'+(i+1)+'</span>' +
      '<span class="item-name" title="'+esc(o.name)+'">'+esc(o.name)+'</span>' +
      '<span class="bar"><i style="width:'+w+'%"></i></span>' +
      '<span class="item-cnt num">'+fmtInt.format(o.cnt)+'</span>' +
      '<span class="item-area num">'+fmtArea.format(o.area)+' м²</span></div>';
  }).join('');
}

/* Чарт адресов ЖК: группировка по адресу приобретения (столбец X). */
function jkPanel(){
  var agg = {}, order = [];
  base.forEach(function(r){
    if(!isCert(r) || !passFilters(r)) return;
    if(devSel && builderKeyOf(r) !== devSel) return;       // выбран застройщик — только его адреса
    var v = addrVariants(r);
    if(!v.length) return;
    v.forEach(function(t){
      var id = norm(t);
      if(!agg[id]){ agg[id] = { id:id, name:t, cnt:0, area:0 }; order.push(id); }
      agg[id].cnt++;
    });
  });
  var list = order.map(function(id){ return agg[id]; });
  list.sort(function(a,b){ return (b.cnt-a.cnt) || a.name.localeCompare(b.name,'ru'); });

  var rowsHtml = list.length
    ? list.map(function(o,i){
        return '<div class="jk-item"><span class="item-rank num">'+(i+1)+'</span>' +
          '<span class="jk-name">'+esc(o.name)+'</span>' +
          '<span class="item-cnt num">'+fmtInt.format(o.cnt)+'</span></div>';
      }).join('')
    : '<div class="empty">Нет адресов по текущему фильтру.</div>';
  if(jkGapSel) rowsHtml = jkGapRows(jkGapSel);

  /* Разложение выборки: адрес приобретения (X) против вида договора (AA).
     Здесь счёт по записям — в отличие от списка, где запись с двумя
     адресами в ячейке попадает в обе строки. */
  var both = 0, addrOnly = 0, dkpOnly = 0;
  base.forEach(function(r){
    if(!isCert(r) || !passFilters(r)) return;
    if(devSel && builderKeyOf(r) !== devSel) return;
    var hasAddr = addrVariants(r).length > 0, hasDkp = isDkp(r);
    if(hasAddr && hasDkp) both++;
    else if(hasAddr) addrOnly++;
    else if(hasDkp) dkpOnly++;
  });

  var title = devSel ? 'Адреса ЖК · ' + esc(devName(devSel)) : 'Адреса ЖК';
  return '<section class="panel" style="--tone:var(--c-agr)">' +
    '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>'+title+'</div>' +
    '<span class="panel-cnt">'+fmtInt.format(list.length)+'</span>' +
    '<span class="panel-area">'+fmtInt.format(both + addrOnly)+' помещений</span>' +
    '</div>' +
    '<div class="jk-split jk-split-row">' +
      'адрес и договор <b class="num">'+fmtInt.format(both)+'</b>' +
      ' · <button type="button" class="gap-btn" data-jkgap="addrNoDkp" aria-pressed="'+(jkGapSel==='addrNoDkp')+'">' +
        'адрес без договора <b class="num">'+fmtInt.format(addrOnly)+'</b></button>' +
      ' · <button type="button" class="gap-btn" data-jkgap="dkpNoAddr" aria-pressed="'+(jkGapSel==='dkpNoAddr')+'">' +
        'договор без адреса <b class="num">'+fmtInt.format(dkpOnly)+'</b></button>' +
    '</div>' +
    '<div class="scroll" id="scroll-jk">'+rowsHtml+'</div></section>';
}

/* Записи с пропуском в паре «адрес — договор». */
function jkGapRows(kind){
  var out = [];
  base.forEach(function(r){
    if(!isCert(r) || !passFilters(r)) return;
    if(devSel && builderKeyOf(r) !== devSel) return;
    var hasAddr = addrVariants(r).length > 0, hasDkp = isDkp(r);
    if(kind === 'addrNoDkp' ? (hasAddr && !hasDkp) : (hasDkp && !hasAddr)) out.push(r);
  });
  if(!out.length) return '<div class="empty">Таких записей нет.</div>';
  return out.map(function(r,i){
    var right = kind === 'addrNoDkp'
      ? esc(addrVariants(r)[0] || '')
      : esc(String(r[COL.contract]||'').trim() + (r[COL.newOkrug] ? ' · ' + resolveOkrug(r[COL.newOkrug]) : ''));
    return '<div class="jk-item"><span class="item-rank num">'+(i+1)+'</span>' +
      '<span class="jk-name"><span class="addr-okrug">'+esc(okrugName(r))+' · '+
        esc(String(r[COL.addr]||'—').trim())+'</span>'+right+'</span>' +
      '<span class="item-cnt num">'+fmtArea.format(num(r[COL.area]))+'</span></div>';
  }).join('');
}

/* Ключ застройщика для строки и подпись выбранного. */
var devNames = {};
function builderKeyOf(r){
  var raw = String(r[COL.builder]||'').trim();
  if(!raw || raw === '—' || raw === '-') return '';
  var id = builderKey(raw);
  for(var k in devNames){ if(sameBuilder(id, k)) return k; }
  return id;
}
function devName(id){ return devNames[id] || id; }

function panel(key, title, tone){
  return '<section class="panel" style="--tone:'+tone+'">' +
    '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>'+title+'</div>' +
    '<div class="sortgroup" role="group" aria-label="Сортировка: '+title+'">' +
    '<button class="ctrl" type="button" data-sort="'+key+'" data-mode="cnt" aria-pressed="'+(sortMode[key]==='cnt')+'">По количеству</button>' +
    '<button class="ctrl" type="button" data-sort="'+key+'" data-mode="area" aria-pressed="'+(sortMode[key]==='area')+'">По площади</button></div>' +
    '</div><div class="scroll" id="list-'+key+'"></div></section>';
}

function fillList(key){
  var test = key === 'cert' ? isCert : (key === 'dkp' ? isDkp : isBuyout);
  var agg = {}, order = [];
  for(var i=0;i<base.length;i++){
    var r = base[i];
    if(!test(r)) continue;
    if(!passFilters(r, 'okrug')) continue;
    var raw = okrugName(r), id = norm(raw);
    if(!agg[id]){ agg[id] = { id:id, name:raw, cnt:0, area:0 }; order.push(id); }
    agg[id].cnt++; agg[id].area += num(r[COL.area]);
  }
  var list = order.map(function(id){ return agg[id]; });
  var mode = sortMode[key];
  list.sort(function(a,b){ return (b[mode] - a[mode]) || a.name.localeCompare(b.name,'ru'); });

  var max = list.length ? list[0][mode] : 1;
  document.getElementById('list-'+key).innerHTML = list.length
    ? list.map(function(o,i){
        var w = max > 0 ? Math.max(2, Math.round(o[mode]/max*100)) : 0;
        var on = state.okrug === o.id;
        return '<button class="item" type="button" data-okrug="'+esc(o.id)+'" aria-pressed="'+(on?'true':'false')+'">' +
          '<span class="item-rank num">'+(i+1)+'</span>' +
          '<span class="item-name" title="'+esc(o.name)+'">'+esc(o.name)+'</span>' +
          '<span class="bar"><i style="width:'+w+'%"></i></span>' +
          '<span class="item-cnt num">'+fmtInt.format(o.cnt)+'</span>' +
          '<span class="item-area num">'+fmtArea.format(o.area)+' м²</span></button>';
      }).join('')
    : '<div class="empty">Нет строк по текущему фильтру.</div>';

  var items = document.querySelectorAll('#list-'+key+' [data-okrug]');
  for(var j=0;j<items.length;j++){
    items[j].addEventListener('click', function(){
      var id = this.getAttribute('data-okrug');
      state.okrug = (state.okrug === id) ? null : id;
      render();
    });
  }
}

function renderFilters(){
  var names = {}, opts = [];
  for(var i=0;i<base.length;i++){
    var raw = okrugName(base[i]), id = norm(raw);
    if(!names[id]){ names[id] = raw; opts.push({ id:id, name:raw }); }
  }
  opts.sort(function(a,b){ return a.name.localeCompare(b.name,'ru'); });

  var oOpts = '<option value="">Все округа</option>' + opts
    .map(function(o){ return '<option value="'+esc(o.id)+'"'+(state.okrug===o.id?' selected':'')+'>'+esc(o.name)+'</option>'; }).join('');
  var dOpts = '<option value="">Все</option>' +
    '<option value="cert"'+(state.deal==='cert'?' selected':'')+'>Сертификаты</option>' +
    '<option value="buy"'+(state.deal==='buy'?' selected':'')+'>Выкупы</option>';
  var tOpts = '<option value="">Все</option>' +
    '<option value="own"'+(state.tenure==='own'?' selected':'')+'>Собственники</option>' +
    '<option value="ten"'+(state.tenure==='ten'?' selected':'')+'>Наниматели</option>';

  document.getElementById('filters').innerHTML =
    '<label>Округ <select id="f-okrug">'+oOpts+'</select></label>' +
    '<label>Тип соглашения <select id="f-deal">'+dOpts+'</select></label>' +
    '<label>Тип собственности <select id="f-tenure">'+tOpts+'</select></label>';

  document.getElementById('f-okrug').addEventListener('change', function(){
    state.okrug = this.value || null; render();
  });
  document.getElementById('f-deal').addEventListener('change', function(){
    state.deal = this.value || null; render();
  });
  document.getElementById('f-tenure').addEventListener('change', function(){
    state.tenure = this.value || null; render();
  });
}

document.getElementById('reset').addEventListener('click', function(){
  state.deal = null; state.tenure = null; state.okrug = null;
  certTenure = null; certOkrug = null; certDkp = false;
  outOkrug = null; outTo = null; outTenure = null;
  inOkrug = null; inFrom = null; inTenure = null;
  stayOkrug = null; stayTenure = null;
  migOkrug = null; migFlow = null; migTenure = null;
  addrSel = { out:null, 'in':null, stay:null };
  query = { out:'', 'in':'', stay:'' };
  panoSel = { out:'', 'in':'', stay:'' };
  certSort = 'cnt'; dkpSort = 'cnt';
  sortMode = { cert:'cnt', buy:'cnt', dkp:'cnt', dev:'cnt', jk:'cnt' };
  devSel = null; gapSel = null; jkGapSel = null;
  if(base.length) render();
});

document.getElementById('reload').addEventListener('click', function(){ load(); });
document.getElementById('tab-btn').addEventListener('click', switchTab);
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-verify]') : null;
  if(b) startVerify(b.getAttribute('data-verify'));
});
[['nav-mig','mig'],['nav-out','out'],['nav-in','in'],['nav-stay','stay']].forEach(function(pair){
  document.getElementById(pair[0]).addEventListener('click', function(){
    switchTo(tab === pair[1] ? 'cert' : pair[1]);
  });
});

/* Enter при выбранном адресе — открыть панораму по адресу приобретения. */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || !addrSel[tab] || !panoSel[tab]) return;
  var t = e.target, n = t && t.tagName ? t.tagName.toLowerCase() : '';
  if(n === 'input' || n === 'select' || n === 'textarea' || (t && t.getAttribute && t.getAttribute('data-addr'))) return;
  window.open(panoSel[tab], '_blank', 'noopener');
});

/* Кнопка «наверх». */
var toTop = document.getElementById('to-top');
window.addEventListener('scroll', function(){
  toTop.hidden = window.scrollY < 300;
});
toTop.addEventListener('click', function(){
  window.scrollTo({ top:0, behavior:'smooth' });
});

load();
})();
</script>
</body>
</html>
