<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сертификаты 2026 — сводка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<!-- Ключ JS API Яндекс.Карт. Второй выданный ключ (9afe41bb-baef-4e4a-91a9-115cbafbcb37)
     нужен для геокодера; здесь он не используется — координаты округов зашиты в файл. -->
<script src="https://api-maps.yandex.ru/2.1/?apikey=2e3ed939-c634-493c-8f57-7bb2075986b1&lang=ru_RU"></script>
<style>
:root{
  --bg:#eceee9;
  --surface:#ffffff;
  --surface-2:#f6f7f4;
  --ink:#0f1317;
  --ink-2:#454c55;
  --muted:#767d87;
  --hair:rgba(15,19,23,.12);
  --hair-soft:rgba(15,19,23,.07);
  --track:rgba(15,19,23,.08);
  --c-agr:#0e7361;
  --c-cert:#1b4d8f;
  --c-buy:#a96a15;
  --c-ten:#4a5a6e;
  --c-own:#6c4a86;
  --focus:#1b4d8f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;text-align:left}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.ctrl{
  border:1px solid var(--hair);background:var(--surface);
  border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;
  transition:border-color .15s,background .15s;
}
.ctrl:hover{border-color:var(--ink-2)}
.ctrl[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

#tools{position:fixed;top:14px;left:14px;z-index:30;display:flex;gap:8px}
#tabs{position:fixed;top:14px;right:14px;z-index:30}
#to-top{position:fixed;right:18px;bottom:18px;z-index:30;width:44px;height:44px;padding:0;
  border-radius:50%;font-size:18px;line-height:1;box-shadow:0 6px 18px rgba(15,19,23,.14)}
[hidden]{display:none!important}
#view-main,#view-cert{display:flex;flex-direction:column;gap:24px}
#view-cert{padding-top:40px}
.row-lead.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.row-lead.three{grid-template-columns:repeat(3,minmax(0,1fr))}
#view-out,#view-in,#view-stay{padding-top:40px;display:flex;flex-direction:column;gap:24px}
.addr-item{width:100%;display:grid;grid-template-columns:26px minmax(140px,1fr) minmax(140px,1fr) 86px 34px;
  align-items:start;gap:12px;padding:10px 12px;border-radius:9px}
.addr-item:nth-child(odd){background:var(--surface-2)}
.addr-item{color:inherit;text-align:left;border:none;font:inherit;transition:background .15s,box-shadow .15s}
.addr-item[role="button"]{cursor:pointer}
.addr-item[role="button"]:hover{background:var(--track)}
.addr-item[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--tone) inset}
.addr-okrug{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.addr-txt{font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
.addr-from{font-weight:500}
.addr-to{color:var(--ink-2)}
.addr-area{font-size:12px;color:var(--ink-2);text-align:right;padding-top:12px}
@media(max-width:640px){.addr-item{grid-template-columns:20px 1fr 1fr 64px 30px;gap:8px}}
.addr-ya{display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin-top:8px;
  border:1px solid var(--hair);border-radius:8px;background:var(--surface);text-decoration:none;
  font-size:13px;font-weight:700;color:#e00;line-height:1;transition:border-color .15s,background .15s}
.addr-ya:hover{border-color:#e00;background:rgba(224,0,0,.06)}
#o-map,#i-map,#s-map{height:560px;border-radius:0 0 14px 14px;overflow:hidden}
@media(max-width:640px){#o-map,#i-map,#s-map{height:380px}}
.panel-open{font:inherit;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;
  border:none;background:none;cursor:pointer;padding:0}
.panel-open .arrow{font-size:12px;color:var(--muted)}
.panel-open:hover .arrow{color:var(--ink)}
.row-lists.three{grid-template-columns:repeat(3,minmax(0,1fr))}
#c-mig .item{grid-template-columns:20px minmax(150px,2.4fr) minmax(20px,.8fr) 40px 74px;gap:8px}
#c-mig .item-name{font-size:12.5px}

main{padding:16px 28px 32px;display:flex;flex-direction:column;gap:24px;max-width:1720px}
.row-lead{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.row-lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* ── сроки программы ───────────────────────────────── */
.plan{display:flex;flex-direction:column;align-items:center;gap:18px}
.plan-title{font-size:22px;font-weight:700;letter-spacing:.01em;text-align:center;text-transform:uppercase}
.plan-track{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;position:relative}
.plan-track::before{content:"";position:absolute;left:10%;right:10%;top:7px;height:1px;background:var(--hair)}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative}
.stage-dot{width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--tone);
  box-shadow:0 0 0 4px var(--bg)}
.stage-card{width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:12px;
  padding:12px 12px 13px;display:flex;flex-direction:column;gap:6px;align-items:center}
.stage-name{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3}
.stage-date{font-size:17px;font-weight:600;letter-spacing:-.02em}
.stage-date .lead{font-size:12px;color:var(--muted);font-weight:500;margin-right:4px}
.stage-was{font:inherit;color:inherit;text-decoration:line-through;margin-right:8px}

/* ── плитки ────────────────────────────────────────── */
.tile{
  width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:14px;
  padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s;
}
.tile::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:var(--tone)}
.tile:hover{border-color:var(--tone)}
.tile[aria-pressed="true"]{border-color:var(--tone);box-shadow:0 0 0 2px var(--tone) inset}
.tile-head{display:flex;align-items:flex-start;gap:12px}
.tile-name{font-size:13px;font-weight:600;letter-spacing:-.005em;flex:1}
.ring{flex:none}
.ring text{font-size:11px;font-weight:600;fill:var(--ink);font-family:inherit}
.tile-figs{display:flex;align-items:baseline;gap:10px}
.fig{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.fig-unit{font-size:13px;color:var(--muted);font-weight:500}
.tile-area{font-size:14px;color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;gap:8px;
  border-top:1px solid var(--hair-soft);padding-top:10px}
.tile-area span:first-child{color:var(--muted);font-size:12px;font-weight:400;align-self:center}

/* ── панели со списками ────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px 14px;border-bottom:1px solid var(--hair-soft)}
.panel-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.swatch{width:9px;height:9px;border-radius:2px;background:var(--tone);flex:none}
.sortgroup{display:flex;gap:6px}
.sortgroup .ctrl{padding:5px 10px;font-size:12px;border-radius:7px}
.scroll{overflow-y:auto;max-height:420px;padding:8px 8px 12px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--track);border-radius:99px}
.item{width:100%;display:grid;grid-template-columns:22px minmax(96px,1.1fr) minmax(60px,2fr) 52px 84px;
  align-items:center;gap:10px;padding:9px 10px;border-radius:9px;transition:background .15s,box-shadow .15s}
.item:nth-child(odd){background:var(--surface-2)}
.item:hover{background:var(--track)}
.item[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--tone) inset}
.item-rank{font-size:11px;color:var(--muted);text-align:right}
.item-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--tone);width:0;transition:width .4s ease}
.item-cnt{font-size:14px;font-weight:600;text-align:right}
".item-area{font-size:12px;color:var(--ink-2);text-align:right}
.empty{padding:28px 16px;color:var(--muted);font-size:13px}

/* ── фильтры под второй строкой ────────────────────── */
.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px 18px}
.filters label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.filters select{
  font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--hair);border-radius:8px;padding:8px 12px;max-width:260px;cursor:pointer}

.notice{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:22px;font-size:13px;color:var(--ink-2);line-height:1.6}
.notice h2{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px}
.notice ol{margin:8px 0 14px 18px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1180px){
  .row-lead,.row-lead.four,.row-lead.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row-lists,.row-lists.three{grid-template-columns:1fr}
}
@media (max-width:900px){
  .plan-track{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .plan-track::before{display:none}
  .stage-dot{display:none}
  .plan-title{font-size:18px}
}
@media (max-width:640px){
  main{padding:56px 14px 24px;gap:16px}
  .row-lead,.row-lead.four,.row-lead.three{grid-template-columns:1fr}
  .fig{font-size:30px}
  .item{grid-template-columns:20px minmax(80px,1fr) 46px 76px;gap:8px}
  .item .bar{display:none}
}
</style>
</head>
<body>

<div id="tools">
  <button class="ctrl" id="reset" type="button">Сбросить</button>
  <button class="ctrl" id="reload" type="button">Обновить</button>
</div>

<div id="tabs"><button class="ctrl" id="tab-btn" type="button">Сертификаты</button></div>
<button class="ctrl" id="to-top" type="button" hidden aria-label="Наверх" title="Наверх">↑</button>

<main>
<div id="view-main">
  <section class="plan" aria-label="Сроки выдачи сертификатов 2026">
    <div class="plan-title">Выдача сертификатов 2026</div>
    <div class="plan-track">
      <div class="stage" style="--tone:var(--c-agr)"><span class="stage-dot"></span>
        <div class="stage-card"><span class="stage-name">Начало приема заявлений</span>
        <span class="stage-date">31.03.2026</span></div></div>
      <div class="stage" style="--tone:var(--c-agr)"><span class="stage-dot"></span>
        <div class="stage-card"><span class="stage-name">Завершение приема заявлений</span>
        <span class="stage-date"><span class="stage-was">01.07.2026</span>04.06.2026</span></div></div>
      <div class="stage" style="--tone:var(--c-cert)"><span class="stage-dot"></span>
        <div class="stage-card"><span class="stage-name">Заключение соглашений</span>
        <span class="stage-date"><span class="lead">до</span>03.08.2026</span></div></div>
      <div class="stage" style="--tone:var(--c-buy)"><span class="stage-dot"></span>
        <div class="stage-card"><span class="stage-name">Заключение ДКП/ДДУ</span>
        <span class="stage-date"><span class="lead">до</span>31.12.2026</span></div></div>
      <div class="stage" style="--tone:var(--c-own)"><span class="stage-dot"></span>
        <div class="stage-card"><span class="stage-name">Оплата</span>

  </section>

  <section class="row-lead" id="row-lead" aria-label="Ключевые показатели"></section>

</div>

<div id="view-out" hidden>
  <section class="row-lead three" id="o-lead" aria-label="Показатели по уехавшим"></section>

  <section class="row-lists" id="o-lists" aria-label="Откуда и куда уехали"></section>

    <div class="panel-head"><div class="panel-title"><span class="swatch"></span>Карта миграции</div>
      <span id="o-map-note" style="margin-left:auto;font-size:12px;color:var(--muted)"></span></div>

<div id="view-in" hidden>
  <section class="row-lead three" id="i-lead" aria-label="Показатели по принятым"></section>

    <div class="panel-head"><div class="panel-title"><span class="swatch"></span>Карта миграции</div>
      <span id="i-map-note" style="margin-left:auto;font-size:12px;color:var(--muted)"></span></div>

<div id="view-stay" hidden>
  <section class="row-lead three" id="s-lead" aria-label="Показатели по оставшимся"></section>
  <section class="filters" id="s-filters" aria-label="Фильтры"></section>
  <section class="panel" id="s-list" style="--tone:var(--c-own)"></section>
  <section class="panel" id="s-addr" style="--tone:var(--c-own)"></section>
  <section class="panel" style="--tone:var(--c-own)">
    <div class="panel-head"><div class="panel-title"><span class="swatch"></span>Карта · остались в своём округе</div>
      <span id="s-map-note" style="margin-left:auto;font-size:12px;color:var(--muted)"></span></div>
    <div id="s-map"></div>
  </section>
</div>

<div id="view-cert" hidden>
  <section class="row-lead four" id="c-lead" aria-label="Показатели по сертификатам"></section>

  <section class="row-lists" id="c-lists" aria-label="Округа и ДКП/ДДУ"></section>
  <section class="row-lists three" id="c-mig" aria-label="Миграция"></section>

  <div id="notice"></div>
</main>

<script>
(function(){
"use strict";

/* ═══ 1. Источник данных ══════════════════════════════════════════════
   Вкладка «Итог». D — Г.О/М.О, H — площадь, L — собственник/наниматель,
   M — сертификат/выкуп, O — решение, P — подписано ли соглашение.     */
var SHEET_ID = '1hyGpt3-zK0NVnjuQpZ-wXfu8CZdXS-n2pzcgao85RPU';
var GID      = '1631641481';
var COL = { okrug:3, addr:5, area:7, tenure:11, type:12, decision:14, agreement:15,
            newOkrug:22, newAddr:23, contract:26 };

function sources(){
  var t = Date.now();
  var csv  = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID+'&_='+t;
  var gviz = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=0&gid='+GID+'&_='+t;
  return [
    gviz, csv,
    'https://api.allorigins.win/raw?url='+encodeURIComponent(csv),
    'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(csv),
    'https://corsproxy.io/?url='+encodeURIComponent(csv)
  ];
}

/* ═══ 2. Нормализация ════════════════════════════════════════════════ */
function norm(v){ return String(v==null?'':v).replace(/\u00a0/g,' ').replace(/ё/gi,'е').trim().toLowerCase(); }
function num(v){
  var s = String(v==null?'':v).replace(/\u00a0/g,'').replace(/\s/g,'');
  if(!s) return 0;
  if(s.indexOf(',')>-1 && s.indexOf('.')>-1) s = s.replace(/,/g,'');
  else if(s.indexOf(',')>-1) s = s.replace(',','.');
  s = s.replace(/[^0-9.\-]/g,'');
  var x = parseFloat(s);
  return isFinite(x) ? x : 0;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function okrugName(r){ return String(r[COL.okrug]||'').replace(/\s+/g,' ').trim(); }

var fmtInt  = new Intl.NumberFormat('ru-RU');
var fmtArea = new Intl.NumberFormat('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});

/* ═══ 3. Правила ═════════════════════════════════════════════════════ */
function isPositive(r){ return norm(r[COL.decision]).indexOf('положительн') >= 0; }
function isBlankDecision(r){
  return String(r[COL.decision]==null?'':r[COL.decision]).replace(/[\s\u00a0\u200b\u2028\u2029]/g,'') === '';
}
function signed(r){ return norm(r[COL.agreement]) === 'да'; }
function isAgreement(r){ return signed(r) && (isPositive(r) || isBlankDecision(r)); }

function isCert(r){ var s=norm(r[COL.type]); return s.indexOf('сертификат')>=0 && s.indexOf('не подавал')<0; }
function isBuyout(r){ var s=norm(r[COL.type]); return s.indexOf('выкуп')>=0 && s.indexOf('не подавал')<0; }
function isTenant(r){ return norm(r[COL.tenure]).indexOf('нанимател')>=0; }
function isOwner(r){ return norm(r[COL.tenure]).indexOf('собственник')>=0; }
function always(){ return true; }

var METRICS = [
  { key:'agr',  name:'Соглашения',   tone:'var(--c-agr)',  test:always },
  { key:'cert', name:'Сертификаты',  tone:'var(--c-cert)', test:isCert },
  { key:'buy',  name:'Выкупы',       tone:'var(--c-buy)',  test:isBuyout },
  { key:'ten',  name:'Наниматели',   tone:'var(--c-ten)',  test:isTenant },
  { key:'own',  name:'Собственники', tone:'var(--c-own)',  test:isOwner }
];
function metricByKey(k){
  for(var i=0;i<METRICS.length;i++) if(METRICS[i].key===k) return METRICS[i];
  return null;
}

/* ═══ 4. Состояние ═══════════════════════════════════════════════════ */
var rows = [], base = [], view = [];
var state = { deal:null, tenure:null, okrug:null };
var sortMode = { cert:'cnt', buy:'cnt' };
var tab = 'main', certSort = 'cnt', dkpSort = 'cnt';
var certTenure = null, certOkrug = null;
var outOkrug = null, outTo = null, outTenure = null;
var inOkrug = null, inFrom = null, inTenure = null;
var stayOkrug = null, stayTenure = null;
var addrSel = { out:null, 'in':null, stay:null };
var panoSel = { out:'', 'in':'', stay:'' };

function buildBase(){ base = rows.filter(isAgreement); }
function metricFor(key){ var m = metricByKey(key); return m ? m.test : null; }
function passFilters(r, skip){
  if(state.deal && skip !== 'deal'){ var d = metricFor(state.deal); if(d && !d(r)) return false; }
  if(state.tenure && skip !== 'tenure'){ var t = metricFor(state.tenure); if(t && !t(r)) return false; }
  if(state.okrug && skip !== 'okrug' && norm(okrugName(r)) !== state.okrug) return false;
  return true;
}
function buildView(){ view = base.filter(function(r){ return passFilters(r); }); }
function slotOf(key){ return (key==='cert'||key==='buy') ? 'deal' : ((key==='ten'||key==='own') ? 'tenure' : null); }

/* ═══ 5. Загрузка ════════════════════════════════════════════════════ */
function parseOne(url, ms){
  return new Promise(function(resolve){
    var done = false;
    var timer = setTimeout(function(){ if(!done){ done=true; resolve(null); } }, ms);
    try{
      Papa.parse(url,{
        download:true, header:false, skipEmptyLines:'greedy',
        complete:function(res){
          if(done) return; done=true; clearTimeout(timer);
          var data = res && res.data ? res.data : [];
          var first = String((data[0]||[])[0]||'').toLowerCase();
          if(!data.length || first.indexOf('<!doctype')>=0 || first.indexOf('<html')>=0){ resolve(null); return; }
          resolve(data);
        },
        error:function(){ if(!done){ done=true; clearTimeout(timer); resolve(null); } }
      });
    }catch(e){ if(!done){ done=true; clearTimeout(timer); resolve(null); } }
  });
}

function keepRow(r){
  if(!r || r.length < 16) return false;
  if(!okrugName(r)) return false;
  if(norm(okrugName(r)).indexOf('итог')===0) return false;
  if(norm(r[COL.area]).indexOf('площад')>=0) return false;
  return num(r[COL.area]) > 0 || isCert(r) || isBuyout(r) || isTenant(r) || isOwner(r) || signed(r);
}

function load(){
  skeleton();
  document.getElementById('notice').innerHTML = '';
  var urls = sources(), pending = urls.length, settled = false;
  urls.forEach(function(u){
    parseOne(u, 12000).then(function(data){
      if(settled) return;
      if(data){
        var f = data.filter(keepRow);
        if(f.length){ settled = true; rows = f; buildBase(); render(); return; }
      }
      pending--;
      if(pending <= 0 && !settled) failure();
    });
  });
}

function skeleton(){

  for(var i=0;i<5;i++){
    cells += '<div class="tile" style="--tone:var(--track);opacity:.45">' +

  document.getElementById('o-lists').innerHTML = '';

/* ═══ 6. Отрисовка ═══════════════════════════════════════════════════ */
function ring(pct, tone){
  var r = 22, c = 2 * Math.PI * r, on = c * Math.max(0, Math.min(1, pct));
  return '<svg class="ring" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">' +
    '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="6"/>' +
    '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="' + tone + '" stroke-width="6" stroke-linecap="round"' +
    ' stroke-dasharray="' + on.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 28 28)"/>' +
    '<text x="28" y="32" text-anchor="middle">' + Math.round(pct * 100) + '%</text></svg>';
}

function render(){
  buildView();
  renderTiles();
  renderPanels();
  renderFilters();
  renderCert();
  if(tab === 'out') renderOut();
  if(tab === 'in') renderIn();
  if(tab === 'stay') renderStay();
}

/* Ключ округа: «городской округ Балашиха», «Балашиха», «Ленинский г.о.» →
   один и тот же ключ. ё и е равнозначны. */
function okrugKey(v){
  var s = norm(v).replace(/[«»"'().,;:\/№]/g,' ');
  var drop = {'городской':1,'городского':1,'город':1,'муниципальный':1,'муниципальное':1,
              'округ':1,'округа':1,'округе':1,'район':1,'г':1,'го':1,'мо':1,'о':1,'гп':1,
              'московская':1,'область':1,'обл':1,
              'деревня':1,'дер':1,'д':1,'поселок':1,'пос':1,'п':1,'село':1,'с':1,'мкр':1,'микрорайон':1};
  var out = [];
  s.split(/\s+/).forEach(function(w){
    if(!w || drop[w]) return;
    if(/^\d+$/.test(w)) return;                 // порядковые номера в сдвоенных ячейках
    out.push(w);
  });
  return out.join(' ');
}

function isDkp(r){ var s = norm(r[COL.contract]); return s.indexOf('дкп') >= 0 || s.indexOf('дду') >= 0; }

var CERT_METRICS = [
  { key:null,  name:'Количество',   tone:'var(--c-cert)', test:function(){return true;} },
  { key:null,  name:'ДКП/ДДУ',      tone:'var(--c-agr)',  test:isDkp },
  { key:'ten', name:'Наниматели',   tone:'var(--c-ten)',  test:isTenant },
  { key:'own', name:'Собственники', tone:'var(--c-own)',  test:isOwner }
];
function tenureTest(k){ return k === 'ten' ? isTenant : (k === 'own' ? isOwner : null); }

/* Строка фильтров вкладки: округ + тип собственности. */
function tabFilters(cfg){
  var oOpts = '<option value="">Все округа</option>' + cfg.okrugs
    .map(function(o){ return '<option value="'+esc(o.id)+'"'+(cfg.okrug===o.id?' selected':'')+'>'+esc(o.name)+'</option>'; }).join('');
  var tOpts = '<option value="">Все</option>' +
    '<option value="own"'+(cfg.tenure==='own'?' selected':'')+'>Собственники</option>' +
    '<option value="ten"'+(cfg.tenure==='ten'?' selected':'')+'>Наниматели</option>';
  document.getElementById(cfg.box).innerHTML =
    '<label>'+cfg.okrugLabel+' <select id="'+cfg.box+'-o">'+oOpts+'</select></label>' +
    '<label>Тип собственности <select id="'+cfg.box+'-t">'+tOpts+'</select></label>';
  document.getElementById(cfg.box+'-o').addEventListener('change', function(){ cfg.onOkrug(this.value || null); });
  document.getElementById(cfg.box+'-t').addEventListener('change', function(){ cfg.onTenure(this.value || null); });
}

function okrugOptions(rowsIn, idFn, nameFn){
  var seen = {}, list = [];
  rowsIn.forEach(function(r){
    var id = idFn(r); if(!id || seen[id]) return;
    seen[id] = 1; list.push({ id:id, name:nameFn(r) });
  });
  list.sort(function(a,b){ return a.name.localeCompare(b.name,'ru'); });
  return list;
}

function renderCert(){
  var certBase = base.filter(isCert);
  var tt = tenureTest(certTenure);
  var byOkrug = certOkrug ? certBase.filter(function(r){ return norm(okrugName(r)) === certOkrug; }) : certBase;
  var certView = byOkrug.filter(function(r){ return !tt || tt(r); });
  var denom = byOkrug.length;

  document.getElementById('c-lead').innerHTML = CERT_METRICS.map(function(m){
    var cnt = 0, area = 0;
    for(var i=0;i<certView.length;i++){
      if(!m.test(certView[i])) continue;
      cnt++; area += num(certView[i][COL.area]);
    }
    var share = denom ? cnt/denom : 0;
    var head = '<div class="tile-head"><div class="tile-name">'+m.name+'</div>' + ring(share, m.tone) + '</div>' +
      '<div class="tile-figs"><span class="fig num">'+fmtInt.format(cnt)+'</span><span class="fig-unit">помещений</span></div>' +
      '<div class="tile-area"><span>Площадь</span><span class="num">'+fmtArea.format(area)+' м²</span></div>';
    if(!m.key) return '<div class="tile" style="--tone:'+m.tone+'">'+head+'</div>';
    return '<button class="tile" type="button" data-ctenure="'+m.key+'" aria-pressed="'+(certTenure===m.key)+'" style="--tone:'+m.tone+'">'+head+'</button>';
  }).join('');

  var tiles = document.querySelectorAll('[data-ctenure]');
  for(var t=0;t<tiles.length;t++) tiles[t].addEventListener('click', function(){
    var k = this.getAttribute('data-ctenure');
    certTenure = (certTenure === k) ? null : k;
    renderCert();
  });

  tabFilters({
    box:'c-filters', okrugLabel:'Округ',
    okrugs: okrugOptions(certBase, function(r){ return norm(okrugName(r)); }, function(r){ return okrugName(r); }),
    okrug: certOkrug, tenure: certTenure,
    onOkrug: function(v){ certOkrug = v; renderCert(); },
    onTenure: function(v){ certTenure = v; renderCert(); }
  });

  var byTenure = certBase.filter(function(r){ return !tt || tt(r); });

  document.getElementById('c-lists').innerHTML =
    certPanel('okrug','Сертификаты по округам','var(--c-cert)', certSort, 'csort') +
    certPanel('dkp','ДКП/ДДУ по округам','var(--c-agr)', dkpSort, 'dsort');
  document.getElementById('c-mig').innerHTML =
    certPanel('out','Уехали в другой округ','var(--c-buy)', null, null) +
    certPanel('in','Приняли из других округов','var(--c-cert)', null, null) +
    certPanel('stay','Остались в своём округе','var(--c-own)', null, null);

  fillOkrugList('okrug', byTenure, certSort);
  fillOkrugList('dkp', byTenure.filter(isDkp), dkpSort);
  fillMigration('out', byTenure);
  fillMigration('stay', byTenure);
  fillIncoming(byTenure);

  bindCertControls();
}

function certPanel(id, title, tone, sort, attr){
  var head = (id === 'out' || id === 'in' || id === 'stay')
    ? '<button class="panel-open" type="button" id="open-'+id+'"><span class="swatch"></span>'+title+'<span class="arrow">→</span></button>'
    : '<div class="panel-title"><span class="swatch"></span>'+title+'</div>';
  var sortBtns = attr
    ? '<div class="sortgroup" role="group" aria-label="Сортировка: '+title+'">' +
      '<button class="ctrl" type="button" data-'+attr+'="cnt" aria-pressed="'+(sort==='cnt')+'">По количеству</button>' +
      '<button class="ctrl" type="button" data-'+attr+'="area" aria-pressed="'+(sort==='area')+'">По площади</button></div>'
    : '';
  return '<section class="panel" style="--tone:'+tone+'">' +
    '<div class="panel-head">' + head + sortBtns +
    '</div><div class="scroll" id="c-list-'+id+'"></div></section>';
}

function okrugRows(list, mode, sel){
  if(!list.length) return '<div class="empty">Нет данных.</div>';
  var max = list[0][mode] || 1;
  return list.map(function(o,i){
    var w = Math.max(2, Math.round(o[mode]/max*100));
    return '<button class="item" type="button" data-cokrug="'+esc(o.id)+'" aria-pressed="'+(sel===o.id)+'">' +
      '<span class="item-rank num">'+(i+1)+'</span>' +
      '<span class="item-name" title="'+esc(o.name)+'">'+esc(o.name)+'</span>' +
      '<span class="bar"><i style="width:'+w+'%"></i></span>' +
      '<span class="item-cnt num">'+fmtInt.format(o.cnt)+'</span>' +
      '<span class="item-area num">'+fmtArea.format(o.area)+' м²</span></button>';
  }).join('');
}

function aggregate(rowsIn){
  var agg = {}, order = [];
  rowsIn.forEach(function(r){
    var raw = okrugName(r), id = norm(raw);
    if(!agg[id]){ agg[id] = { id:id, name:raw, cnt:0, area:0 }; order.push(id); }
    agg[id].cnt++; agg[id].area += num(r[COL.area]);
  });
  return order.map(function(id){ return agg[id]; });
}

function fillOkrugList(id, rowsIn, mode){
  var list = aggregate(rowsIn);
  list.sort(function(a,b){ return (b[mode]-a[mode]) || a.name.localeCompare(b.name,'ru'); });
  document.getElementById('c-list-'+id).innerHTML = okrugRows(list, mode, certOkrug);
}

function fillMigration(kind, rowsIn){
  var picked = rowsIn.filter(function(r){
    var to = resolveOkrug(r[COL.newOkrug]);
    if(!to) return false;
    var same = to === resolveOkrug(okrugName(r));
    return kind === 'stay' ? same : !same;
  });
  var list = aggregate(picked);
  list.sort(function(a,b){ return (b.cnt-a.cnt) || a.name.localeCompare(b.name,'ru'); });
  document.getElementById('c-list-'+kind).innerHTML = okrugRows(list, 'cnt', certOkrug);
}

/* Справочник написаний: ключ — нормализованное значение столбца W,
   значение — как округ должен выглядеть на дашборде. */
var CANON = {
  'лосино-петровский':'Лосино-Петровский',
  'щелково':'Щёлково','щелковский':'Щёлково',
  'раменский':'Раменский',
  'электросталь':'Электросталь',
  'люберцы':'Люберцы','люберецкий':'Люберцы',
  'балашиха':'Балашиха',
  'ленинский':'Ленинский',
  'домодедово':'Домодедово','домодедовский':'Домодедово',
  'солнечногорск':'Солнечногорск','солнечногорский':'Солнечногорск',
  'сергиево-посадский':'Сергиево-Посадский',
  'дмитровский':'Дмитровский','дмитров':'Дмитровский',
  'кашира':'Кашира',
  'рузский':'Рузский',
  'егорьевск':'Егорьевск',
  'волоколамский':'Волоколамский',
  'коломна':'Коломна',
  'мытищи':'Мытищи','мытищинской':'Мытищи',
  'пушкинский':'Пушкинский','пушкино':'Пушкинский',
  'ступино':'Ступино',
  'подольск':'Подольск',
  'жуковский':'Жуковский',
  'королев':'Королёв',
  'лыткарино':'Лыткарино','лыткарино лыткарино':'Лыткарино',
  'богородский':'Богородский','ногинск':'Богородский',
  'ивантеевка':'Пушкинский','красноармейск':'Пушкинский',
  'хотьково':'Сергиево-Посадский',
  'звенигород':'Одинцовский',
  'п монино':'Щёлково','монино':'Щёлково',
  'луховицы':'Луховицы',
  'наро-фоминский':'Наро-Фоминский',
  'одинцовский':'Одинцовский','одинцово':'Одинцовский',

  'красногорск':'Красногорск',

  'павлово-посадский':'Павлово-Посадский',
  'клин':'Клин',
  'реутов':'Реутов',
  'пушкинский ивантеевка':'Пушкинский'
};
var CANON_KEYS = Object.keys(CANON).sort(function(a,b){ return b.length - a.length; });

/* Возвращает единое название округа для любого написания в столбце W.
   Сначала точное совпадение ключа, затем поиск известного названия
   внутри строки — это разбирает ячейки вида «1. г.о. Лыткарино; 2. …»
   и «Московская область, Люберецкий район». */
function resolveOkrug(raw){
  var key = okrugKey(raw);
  if(!key) return '';
  if(CANON[key]) return CANON[key];
  var best = null, bestPos = 1e9;
  for(var i=0;i<CANON_KEYS.length;i++){
    var k = CANON_KEYS[i];
    var pos = (' '+key+' ').indexOf(' '+k+' ');
    if(pos >= 0 && pos < bestPos){ bestPos = pos; best = CANON[k]; }
  }
  if(best) return best;
  var t = String(raw||'').replace(/\s+/g,' ').trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : key;
}

function fillIncoming(rowsIn){
  var agg = {}, order = [];
  rowsIn.forEach(function(r){
    var to = resolveOkrug(r[COL.newOkrug]);
    if(!to) return;
    if(to === resolveOkrug(okrugName(r))) return;     // переехали внутри своего округа
    if(!agg[to]){ agg[to] = { id:to, name:to, cnt:0, area:0 }; order.push(to); }
    agg[to].cnt++; agg[to].area += num(r[COL.area]);
  });
  var list = order.map(function(id){ return agg[id]; });
  list.sort(function(a,b){ return (b.cnt-a.cnt) || a.name.localeCompare(b.name,'ru'); });

  document.getElementById('c-list-in').innerHTML = list.length
    ? (function(){
        var max = list[0].cnt || 1;
        return list.map(function(o,i){
          var w = Math.max(2, Math.round(o.cnt/max*100));
          return '<div class="item"><span class="item-rank num">'+(i+1)+'</span>' +
            '<span class="item-name" title="'+esc(o.name)+'">'+esc(o.name)+'</span>' +
            '<span class="bar"><i style="width:'+w+'%"></i></span>' +
            '<span class="item-cnt num">'+fmtInt.format(o.cnt)+'</span>' +
            '<span class="item-area num">'+fmtArea.format(o.area)+' м²</span></div>';
        }).join('');
      })()
    : '<div class="empty">Нет данных.</div>';
}

function bindCertControls(){
  var openOut = document.getElementById('open-out');
  if(openOut) openOut.addEventListener('click', function(){ switchTo('out'); });
  var openIn = document.getElementById('open-in');
  if(openIn) openIn.addEventListener('click', function(){ switchTo('in'); });
  var openStay = document.getElementById('open-stay');
  if(openStay) openStay.addEventListener('click', function(){ switchTo('stay'); });
  var cs = document.querySelectorAll('[data-csort]');
  for(var a=0;a<cs.length;a++) cs[a].addEventListener('click', function(){
    certSort = this.getAttribute('data-csort'); renderCert();
  });
  var ds = document.querySelectorAll('[data-dsort]');
  for(var b=0;b<ds.length;b++) ds[b].addEventListener('click', function(){
    dkpSort = this.getAttribute('data-dsort'); renderCert();
  });
  var os = document.querySelectorAll('[data-cokrug]');
  for(var c=0;c<os.length;c++) os[c].addEventListener('click', function(){
    var id = this.getAttribute('data-cokrug');
    certOkrug = (certOkrug === id) ? null : id;
    renderCert();
  });
}

function outRowsAll(){
  return base.filter(isCert).filter(function(r){
    var to = resolveOkrug(r[COL.newOkrug]);
    return to && to !== resolveOkrug(okrugName(r));
  });
}

var OUT_METRICS = [
  { key:null,  name:'Количество',   tone:'var(--c-buy)', test:function(){return true;} },
  { key:'ten', name:'Наниматели',   tone:'var(--c-ten)', test:isTenant },
  { key:'own', name:'Собственники', tone:'var(--c-own)', test:isOwner }
];

function renderOut(){
  var all = outRowsAll();
  var ot = tenureTest(outTenure);
  var byOkrug = all.filter(function(r){
    if(outOkrug && norm(okrugName(r)) !== outOkrug) return false;
    if(outTo && resolveOkrug(r[COL.newOkrug]) !== outTo) return false;
    return true;
  });
  var scope = byOkrug.filter(function(r){ return !ot || ot(r); });

  document.getElementById('o-lead').innerHTML = OUT_METRICS.map(function(m){
    var cnt = 0, area = 0;
    for(var i=0;i<scope.length;i++){
      if(!m.test(scope[i])) continue;
      cnt++; area += num(scope[i][COL.area]);
    }
    var share = byOkrug.length ? cnt/byOkrug.length : 0;
    var head = '<div class="tile-head"><div class="tile-name">'+m.name+'</div>' + ring(share, m.tone) + '</div>' +
      '<div class="tile-figs"><span class="fig num">'+fmtInt.format(cnt)+'</span><span class="fig-unit">помещений</span></div>' +
      '<div class="tile-area"><span>Площадь</span><span class="num">'+fmtArea.format(area)+' м²</span></div>';
    if(!m.key) return '<div class="tile" style="--tone:'+m.tone+'">'+head+'</div>';
    return '<button class="tile" type="button" data-otenure="'+m.key+'" aria-pressed="'+(outTenure===m.key)+'" style="--tone:'+m.tone+'">'+head+'</button>';
  }).join('');

  var otiles = document.querySelectorAll('[data-otenure]');
  for(var t=0;t<otiles.length;t++) otiles[t].addEventListener('click', function(){
    var k = this.getAttribute('data-otenure');
    outTenure = (outTenure === k) ? null : k;
    renderOut();
  });

  tabFilters({
    box:'o-filters', okrugLabel:'Округ выбытия',
    okrugs: okrugOptions(all, function(r){ return norm(okrugName(r)); }, function(r){ return okrugName(r); }),
    okrug: outOkrug, tenure: outTenure,
    onOkrug: function(v){ outOkrug = v; renderOut(); },
    onTenure: function(v){ outTenure = v; renderOut(); }
  });

  var toTitle = outOkrug
    ? 'Куда уехали · ' + esc(okrugLabel(all, outOkrug))
    : 'Куда уехали';
  document.getElementById('o-lists').innerHTML =
    '<section class="panel" style="--tone:var(--c-buy)">' +
      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Откуда уехали</div></div>' +
      '<div class="scroll" id="o-list-from"></div></section>' +
    '<section class="panel" style="--tone:var(--c-cert)">' +
      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>'+toTitle+'</div></div>' +
      '<div class="scroll" id="o-list-to"></div></section>';

  var fromList = aggregate(all.filter(function(r){
    if(ot && !ot(r)) return false;
    if(outTo && resolveOkrug(r[COL.newOkrug]) !== outTo) return false;
    return true;
  }));
  fromList.sort(function(a,b){ return (b.cnt-a.cnt) || a.name.localeCompare(b.name,'ru'); });
  document.getElementById('o-list-from').innerHTML = okrugRows(fromList, 'cnt', outOkrug);

  if(!outOkrug){
    document.getElementById('o-list-to').innerHTML =
      '<div class="empty">Выберите округ в списке слева — здесь появятся округа, куда уехали из него.</div>';
  }else{
    var agg = {}, order = [];
    all.filter(function(r){
      if(norm(okrugName(r)) !== outOkrug) return false;
      return !ot || ot(r);
    }).forEach(function(r){
      var to = resolveOkrug(r[COL.newOkrug]);
      if(!to) return;
      if(!agg[to]){ agg[to] = { id:to, name:to, cnt:0, area:0 }; order.push(to); }
      agg[to].cnt++; agg[to].area += num(r[COL.area]);
    });
    var toList = order.map(function(id){ return agg[id]; });
    toList.sort(function(a,b){ return (b.cnt-a.cnt) || a.name.localeCompare(b.name,'ru'); });
    document.getElementById('o-list-to').innerHTML = toList.length
      ? okrugRows(toList, 'cnt', outTo).replace(/data-cokrug/g,'data-oto')
      : '<div class="empty">Нет данных.</div>';
  }

  var items = document.querySelectorAll('#o-list-from [data-cokrug]');
  for(var j=0;j<items.length;j++) items[j].addEventListener('click', function(){
    var id = this.getAttribute('data-cokrug');
    outOkrug = (outOkrug === id) ? null : id;
    outTo = null; addrSel.out = null;
    renderOut();
  });
  var toItems = document.querySelectorAll('#o-list-to [data-oto]');
  for(var k=0;k<toItems.length;k++) toItems[k].addEventListener('click', function(){
    var id = this.getAttribute('data-oto');
    outTo = (outTo === id) ? null : id; addrSel.out = null;
    renderOut();
  });

  var picked = addrSel.out ? scope.filter(function(r){ return addrKey(r) === addrSel.out; }) : [];
  if(addrSel.out && !picked.length) addrSel.out = null;

  renderAddresses('o-addr', scope, {
    selectable:true, selected:addrSel.out,
    onSelect:function(key){ addrSel.out = (addrSel.out === key) ? null : key; renderOut(); },
    panoOf:function(key){
      for(var i=0;i<scope.length;i++) if(addrKey(scope[i]) === key) return panoUrl(scope[i]);
      return '';
    }
  });
  panoSel.out = picked.length ? panoUrl(picked[0]) : '';
  drawMigMap('o-map', picked.length ? picked : scope);
}

  for(var i=0;i<rowsIn.length;i++) if(norm(okrugName(rowsIn[i])) === id) return okrugName(rowsIn[i]);

var MAPS = {};

function drawMigMap(mapId, scope){
  var note = document.getElementById(mapId+'-note');
  if(typeof ymaps === 'undefined'){
    if(note) note.textContent = 'Яндекс.Карты не загрузились — проверьте ключ и разрешённые домены';
    return;
  }
  ymaps.ready(function(){
    if(!MAPS[mapId]){
      MAPS[mapId] = new ymaps.Map(mapId, {
        center:[55.65,37.6], zoom:8,
        controls:['zoomControl','fullscreenControl','typeSelector']
      }, { suppressMapOpenBlock:true });
    }
    var omap = MAPS[mapId];
    omap.geoObjects.removeAll();

    var pairs = {}, missing = {};
    scope.forEach(function(r){
      var from = okrugName(r), to = resolveOkrug(r[COL.newOkrug]);
      if(!to) return;
      var a = centerOf(from), b = centerOf(to);
      if(!a){ missing[from] = 1; return; }
      if(!b){ missing[to] = 1; return; }
      var id = norm(from) + '→' + norm(to);
      if(!pairs[id]) pairs[id] = { from:from, to:to, a:a, b:b, cnt:0, area:0 };
      pairs[id].cnt++; pairs[id].area += num(r[COL.area]);
    });

    var keys = Object.keys(pairs), pts = [], maxCnt = 1;
    keys.forEach(function(k){ if(pairs[k].cnt > maxCnt) maxCnt = pairs[k].cnt; });

    keys.forEach(function(k){
      var p = pairs[k];
      if(norm(p.from) === norm(p.to)){ pts.push(p.a); return; }   // переезд внутри округа — линии нет
      var w = 2 + Math.round(p.cnt / maxCnt * 8);
      var line = new ymaps.Polyline([p.a, p.b], {
        balloonContent:'<b>'+esc(p.from)+' → '+esc(p.to)+'</b><br>'+p.cnt+' помещений · '+fmtArea.format(p.area)+' м²',
        hintContent:esc(p.from)+' → '+esc(p.to)+': '+p.cnt
      }, { strokeColor:'#a96a15', strokeWidth:w, strokeOpacity:0.55 });
      omap.geoObjects.add(line);
      pts.push(p.a, p.b);
    });

    var froms = {}, tos = {};
    keys.forEach(function(k){
      var p = pairs[k];
      if(!froms[norm(p.from)]) froms[norm(p.from)] = { name:p.from, c:p.a, cnt:0 };
      froms[norm(p.from)].cnt += p.cnt;
      if(!tos[norm(p.to)]) tos[norm(p.to)] = { name:p.to, c:p.b, cnt:0 };
      tos[norm(p.to)].cnt += p.cnt;
    });
    Object.keys(froms).forEach(function(k){
      var o = froms[k];
      omap.geoObjects.add(new ymaps.Placemark(o.c, {
        iconContent:String(o.cnt),
        balloonContent:'<b>'+esc(o.name)+'</b><br>уехали: '+o.cnt,
        hintContent:esc(o.name)+' · уехали '+o.cnt
      }, { preset:'islands#orangeCircleIconWithContent', iconColor:'#a96a15' }));
    });
    Object.keys(tos).forEach(function(k){
      var o = tos[k];
      if(froms[k]) return;
      omap.geoObjects.add(new ymaps.Placemark(o.c, {
        iconContent:String(o.cnt),
        balloonContent:'<b>'+esc(o.name)+'</b><br>приняли: '+o.cnt,
        hintContent:esc(o.name)+' · приняли '+o.cnt
      }, { preset:'islands#blueCircleIconWithContent', iconColor:'#1b4d8f' }));
    });

    if(pts.length){
      try{ omap.setBounds(ymaps.util.bounds.fromPoints(pts), { checkZoomRange:true, zoomMargin:40 }); }catch(e){}
    }
    var miss = Object.keys(missing);
    if(note) note.textContent = keys.length + ' направлений' +
      (miss.length ? ' · без координат: ' + miss.join(', ') : '');
  });
}

/* Чарт с адресами: откуда (столбец F) → куда (столбец X).
   selectable: строки кликабельны, выбор сужает карту до одного направления. */
function panoUrl(r){
  var toTxt = String(r[COL.newAddr]||'').trim();
  if(!toTxt) return '';
  var toOkrug = resolveOkrug(r[COL.newOkrug]) || '';
  return 'https://yandex.ru/maps/?l=stv%2Csta&text=' +
    encodeURIComponent((toOkrug ? toOkrug + ', ' : '') + toTxt);
}

function addrKey(r){
  return norm(okrugName(r)) + '|' + norm(r[COL.addr]) + '|' + norm(r[COL.newAddr]) + '|' + num(r[COL.area]);
}

function renderAddresses(boxId, rowsIn, opts){
  opts = opts || {};
  var list = rowsIn.slice().sort(function(a,b){
    return okrugName(a).localeCompare(okrugName(b),'ru') ||
           String(a[COL.addr]||'').localeCompare(String(b[COL.addr]||''),'ru');
  });
  var body = list.length
    ? list.map(function(r,i){
        var attrs = opts.selectable
          ? ' role="button" tabindex="0" data-addr="'+esc(addrKey(r))+'" aria-pressed="'+(opts.selected===addrKey(r))+'"'
          : '';
        var pUrl = panoUrl(r);
        var pano = pUrl
          ? '<a class="addr-ya" href="'+pUrl+'" target="_blank" rel="noopener" title="Панорама по адресу приобретения">Я</a>'
          : '<span></span>';
        return '<div class="addr-item"'+attrs+'><span class="item-rank num">'+(i+1)+'</span>' +
          '<span class="addr-txt addr-from"><span class="addr-okrug">'+esc(okrugName(r))+'</span>' +
            esc(String(r[COL.addr]||'—').trim()) + '</span>' +
          '<span class="addr-txt addr-to"><span class="addr-okrug">'+esc(resolveOkrug(r[COL.newOkrug])||'—')+'</span>' +
            esc(String(r[COL.newAddr]||'—').trim()) + '</span>' +
          '<span class="addr-area num">'+fmtArea.format(num(r[COL.area]))+' м²</span>' + pano + '</div>';
      }).join('')
    : '<div class="empty">Нет записей по текущему фильтру.</div>';

  document.getElementById(boxId).innerHTML =
    '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Адреса · откуда → куда</div>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">'+fmtInt.format(list.length)+' записей</span></div>' +
    '<div class="scroll">'+body+'</div>';

  if(opts.selectable && opts.onSelect){
    var rows = document.querySelectorAll('#'+boxId+' [data-addr]');
    for(var i=0;i<rows.length;i++){
      rows[i].addEventListener('click', function(e){
        if(e.target.closest('.addr-ya')) return;      // клик по кнопке панорамы
        opts.onSelect(this.getAttribute('data-addr'));
      });
      rows[i].addEventListener('keydown', function(e){
        if(e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        var key = this.getAttribute('data-addr');
        if(e.key === 'Enter' && opts.selected === key && opts.panoOf){
          var u = opts.panoOf(key);
          if(u) window.open(u, '_blank', 'noopener');
          return;
        }
        opts.onSelect(key);
      });
    }
  }
}

function renderIn(){

  var it = tenureTest(inTenure);

  document.getElementById('i-lead').innerHTML = IN_METRICS.map(function(m){
    var cnt = 0, area = 0;

    }

  });

  tabFilters({
    box:'i-filters', okrugLabel:'Округ приобретения',
    okrugs: okrugOptions(all, function(r){ return resolveOkrug(r[COL.newOkrug]); }, function(r){ return resolveOkrug(r[COL.newOkrug]); }),
    okrug: inOkrug, tenure: inTenure,

      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>'+fromTitle+'</div></div>' +
      '<div class="scroll" id="i-list-from"></div></section>';

  var agg = {}, order = [];
  all.filter(function(r){
    if(it && !it(r)) return false;
    if(inFrom && norm(okrugName(r)) !== inFrom) return false;
    return true;
  }).forEach(function(r){
    var to = resolveOkrug(r[COL.newOkrug]);
    if(!to) return;
    if(!agg[to]){ agg[to] = { id:to, name:to, cnt:0, area:0 }; order.push(to); }
    agg[to].cnt++; agg[to].area += num(r[COL.area]);

  }else{

    panoOf:function(key){

  document.getElementById('view-in').hidden   = name !== 'in';

  if(name === 'out') renderOut();
  if(name === 'in') renderIn();
  if(name === 'stay') renderStay();
  window.scrollTo({ top:0, behavior:'auto' });   // вкладка открывается с начала страницы
}

function switchTab(){
  switchTo(tab === 'main' ? 'cert' : (tab === 'cert' ? 'main' : 'cert'));
}

function renderTiles(){
  var denom = state.okrug
    ? base.filter(function(r){ return norm(okrugName(r)) === state.okrug; }).length
    : base.length;

  document.getElementById('row-lead').innerHTML = METRICS.map(function(m){
    var cnt = 0, area = 0;
    for(var i=0;i<view.length;i++){
      if(!m.test(view[i])) continue;
      cnt++; area += num(view[i][COL.area]);
    }
    var share = denom ? cnt/denom : 0;
    var slot = slotOf(m.key);
    var on = slot ? (state[slot] === m.key) : (!state.deal && !state.tenure);
    return '<button class="tile" type="button" data-metric="'+m.key+'" aria-pressed="'+(on?'true':'false')+'" style="--tone:'+m.tone+'">' +
      '<div class="tile-head"><div class="tile-name">'+m.name+'</div>' + ring(share, m.tone) + '</div>' +
      '<div class="tile-figs"><span class="fig num">'+fmtInt.format(cnt)+'</span><span class="fig-unit">помещений</span></div>' +
      '<div class="tile-area"><span>Площадь</span><span class="num">'+fmtArea.format(area)+' м²</span></div>' +
      '</button>';
  }).join('');

  var tiles = document.querySelectorAll('[data-metric]');
  for(var i=0;i<tiles.length;i++){
    tiles[i].addEventListener('click', function(){
      var k = this.getAttribute('data-metric'), slot = slotOf(k);
      if(!slot){ state.deal = null; state.tenure = null; }
      else state[slot] = (state[slot] === k) ? null : k;
      render();
    });
  }
}

function renderPanels(){
  document.getElementById('row-lists').innerHTML =
    panel('cert','Сертификаты по округам','var(--c-cert)') +
    panel('buy','Выкупы по округам','var(--c-buy)');

  var btns = document.querySelectorAll('[data-sort]');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){
      sortMode[this.getAttribute('data-sort')] = this.getAttribute('data-mode');
      render();
    });
  }
  fillList('cert'); fillList('buy');
}

function panel(key, title, tone){
  return '<section class="panel" style="--tone:'+tone+'">' +
    '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>'+title+'</div>' +
    '<div class="sortgroup" role="group" aria-label="Сортировка: '+title+'">' +
    '<button class="ctrl" type="button" data-sort="'+key+'" data-mode="cnt" aria-pressed="'+(sortMode[key]==='cnt')+'">По количеству</button>' +
    '<button class="ctrl" type="button" data-sort="'+key+'" data-mode="area" aria-pressed="'+(sortMode[key]==='area')+'">По площади</button></div>' +
    '</div><div class="scroll" id="list-'+key+'"></div></section>';
}

function fillList(key){
  var test = key === 'cert' ? isCert : isBuyout;
  var agg = {}, order = [];
  for(var i=0;i<base.length;i++){
    var r = base[i];
    if(!test(r)) continue;
    if(!passFilters(r, 'okrug')) continue;
    var raw = okrugName(r), id = norm(raw);
    if(!agg[id]){ agg[id] = { id:id, name:raw, cnt:0, area:0 }; order.push(id); }
    agg[id].cnt++; agg[id].area += num(r[COL.area]);
  }
  var list = order.map(function(id){ return agg[id]; });
  var mode = sortMode[key];
  list.sort(function(a,b){ return (b[mode] - a[mode]) || a.name.localeCompare(b.name,'ru'); });

  var max = list.length ? list[0][mode] : 1;
  document.getElementById('list-'+key).innerHTML = list.length
    ? list.map(function(o,i){
        var w = max > 0 ? Math.max(2, Math.round(o[mode]/max*100)) : 0;
        var on = state.okrug === o.id;
        return '<button class="item" type="button" data-okrug="'+esc(o.id)+'" aria-pressed="'+(on?'true':'false')+'">' +
          '<span class="item-rank num">'+(i+1)+'</span>' +
          '<span class="item-name" title="'+esc(o.name)+'">'+esc(o.name)+'</span>' +
          '<span class="bar"><i style="width:'+w+'%"></i></span>' +
          '<span class="item-cnt num">'+fmtInt.format(o.cnt)+'</span>' +
          '<span class="item-area num">'+fmtArea.format(o.area)+' м²</span></button>';
      }).join('')
    : '<div class="empty">Нет строк по текущему фильтру.</div>';

  var items = document.querySelectorAll('#list-'+key+' [data-okrug]');
  for(var j=0;j<items.length;j++){
    items[j].addEventListener('click', function(){
      var id = this.getAttribute('data-okrug');
      state.okrug = (state.okrug === id) ? null : id;
      render();
    });
  }
}

function renderFilters(){
  var names = {}, opts = [];
  for(var i=0;i<base.length;i++){
    var raw = okrugName(base[i]), id = norm(raw);
    if(!names[id]){ names[id] = raw; opts.push({ id:id, name:raw }); }
  }
  opts.sort(function(a,b){ return a.name.localeCompare(b.name,'ru'); });

  var oOpts = '<option value="">Все округа</option>' + opts
    .map(function(o){ return '<option value="'+esc(o.id)+'"'+(state.okrug===o.id?' selected':'')+'>'+esc(o.name)+'</option>'; }).join('');
  var dOpts = '<option value="">Все</option>' +
    '<option value="cert"'+(state.deal==='cert'?' selected':'')+'>Сертификаты</option>' +
    '<option value="buy"'+(state.deal==='buy'?' selected':'')+'>Выкупы</option>';
  var tOpts = '<option value="">Все</option>' +
    '<option value="own"'+(state.tenure==='own'?' selected':'')+'>Собственники</option>' +
    '<option value="ten"'+(state.tenure==='ten'?' selected':'')+'>Наниматели</option>';

  document.getElementById('filters').innerHTML =
    '<label>Округ <select id="f-okrug">'+oOpts+'</select></label>' +
    '<label>Тип соглашения <select id="f-deal">'+dOpts+'</select></label>' +
    '<label>Тип собственности <select id="f-tenure">'+tOpts+'</select></label>';

  document.getElementById('f-okrug').addEventListener('change', function(){
    state.okrug = this.value || null; render();
  });
  document.getElementById('f-deal').addEventListener('change', function(){
    state.deal = this.value || null; render();
  });
  document.getElementById('f-tenure').addEventListener('change', function(){
    state.tenure = this.value || null; render();
  });
}

document.getElementById('reset').addEventListener('click', function(){
  state.deal = null; state.tenure = null; state.okrug = null;
  certTenure = null; certOkrug = null;
  outOkrug = null; outTo = null; outTenure = null;
  inOkrug = null; inFrom = null; inTenure = null;
  stayOkrug = null; stayTenure = null;
  addrSel = { out:null, 'in':null, stay:null };
  panoSel = { out:'', 'in':'', stay:'' };
  certSort = 'cnt'; dkpSort = 'cnt';
  sortMode = { cert:'cnt', buy:'cnt' };
  if(base.length) render();
});

document.getElementById('reload').addEventListener('click', function(){ load(); });
document.getElementById('tab-btn').addEventListener('click', switchTab);

/* Enter при выбранном адресе — открыть панораму по адресу приобретения. */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || !addrSel[tab] || !panoSel[tab]) return;
  var t = e.target, n = t && t.tagName ? t.tagName.toLowerCase() : '';
  if(n === 'input' || n === 'select' || n === 'textarea' || (t && t.getAttribute && t.getAttribute('data-addr'))) return;
  window.open(panoSel[tab], '_blank', 'noopener');
});

/* Кнопка «наверх». */
var toTop = document.getElementById('to-top');
window.addEventListener('scroll', function(){
  toTop.hidden = window.scrollY < 300;
});
toTop.addEventListener('click', function(){
  window.scrollTo({ top:0, behavior:'smooth' });
});

load();
})();
</script>
</body>
</html>
